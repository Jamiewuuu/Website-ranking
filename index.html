<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站榜单 - AI 工具排名</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          maxWidth: {
            '8xl': '1600px'
          }
        }
      }
    }
  </script>
  <style>
    /* 备注折叠样式 */
    .note-clamp {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-wrap;
    }
    .note-expanded {
      display: block;
      overflow: visible;
      white-space: pre-wrap;
    }

    /* 排序箭头样式 */
    .sort-arrows {
      display: inline-flex;
      flex-direction: column;
      margin-left: 4px;
      line-height: 0;
    }
    .sort-arrows i {
      font-size: 14px;
      color: #d1d5db;
      cursor: pointer;
      transition: color 0.15s;
      height: 10px;
      display: flex;
      align-items: center;
    }
    .sort-arrows i:hover {
      color: #2563eb;
    }
    .sort-arrows i.active {
      color: #2563eb;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen">

  <!-- Component: Header -->
  <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-gray-200/50 sticky top-0 z-40">
    <div class="max-w-8xl mx-auto px-6 py-5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/25">
            <i class="fas fa-chart-line text-white text-lg"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent">网站榜单</h1>
            <p class="text-sm text-gray-500">AI 网站流量增长排名</p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <div class="hidden md:flex items-center gap-2 text-sm text-gray-500">
            <i class="fas fa-database"></i>
            <span id="headerStats">数据统计</span>
          </div>
          <button onclick="togglePersonalCenter()" id="personalCenterBtn" class="inline-flex items-center px-4 py-2 text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all border border-gray-200">
            <i class="fas fa-user mr-2"></i>
            <span>个人中心</span>
          </button>
        </div>
      </div>
    </div>
  </header>
  <!-- /Component: Header -->

  <!-- 主视图：榜单 -->
  <main id="mainView" class="max-w-8xl mx-auto px-6 py-8">
    <div class="flex flex-col lg:flex-row gap-8">

      <!-- Component: MonthSidebar -->
      <aside class="lg:w-52 flex-shrink-0">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 overflow-hidden lg:sticky lg:top-24 lg:max-h-[calc(100vh-7rem)] flex flex-col">
          <div class="p-4 bg-gradient-to-r from-blue-600 to-indigo-600 flex-shrink-0">
            <div class="flex items-center gap-2 text-white">
              <i class="fas fa-calendar-alt"></i>
              <span class="font-semibold">选择月份</span>
            </div>
          </div>
          <div id="monthList" class="flex-1 overflow-y-auto">
            <div class="p-6 text-sm text-gray-400 text-center">
              <i class="fas fa-inbox text-3xl mb-3 text-gray-300"></i>
              <p>请上传数据</p>
            </div>
          </div>
        </div>
      </aside>
      <!-- /Component: MonthSidebar -->

      <!-- 右侧主内容区 -->
      <div class="flex-1 min-w-0">

        <!-- Component: RankingTabs - 动态渲染 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 p-2 mb-6">
          <div id="rankingTabs" class="flex">
            <!-- 由 renderRankingTabs() 动态生成 -->
          </div>
        </div>
        <!-- /Component: RankingTabs -->

        <!-- Component: ActionBar -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 p-5 mb-6">
          <div class="flex flex-wrap items-center gap-3">
            <label id="uploadBtn" class="inline-flex items-center px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl cursor-pointer hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:scale-105">
              <i class="fas fa-upload mr-2"></i>
              <span id="uploadBtnText" class="font-medium">上传数据</span>
              <input type="file" id="uploadInput" accept=".json" class="hidden" onchange="handleCurrentRankingUpload(event)">
            </label>
            <button onclick="openPasteModal()" class="inline-flex items-center px-5 py-2.5 bg-blue-50 text-blue-700 rounded-xl hover:bg-blue-100 transition-all hover:scale-105 border border-blue-200">
              <i class="fas fa-paste mr-2"></i>
              <span class="font-medium">粘贴 JSON</span>
            </button>
            <button onclick="handleDownload()" class="inline-flex items-center px-5 py-2.5 bg-gray-50 text-gray-700 rounded-xl hover:bg-gray-100 transition-all hover:scale-105 border border-gray-200">
              <i class="fas fa-download mr-2"></i>
              <span class="font-medium">下载 JSON</span>
            </button>
            <button onclick="handleClearCurrentMonth()" class="inline-flex items-center px-5 py-2.5 bg-red-50 text-red-600 rounded-xl hover:bg-red-100 transition-all hover:scale-105 border border-red-200">
              <i class="fas fa-trash-alt mr-2"></i>
              <span class="font-medium">清空当前月</span>
            </button>
            <div class="w-px h-8 bg-gray-200 mx-1"></div>
            <button onclick="handleTranslate()" id="translateBtn" class="inline-flex items-center px-5 py-2.5 bg-green-50 text-green-700 rounded-xl hover:bg-green-100 transition-all hover:scale-105 border border-green-200">
              <i class="fas fa-language mr-2"></i>
              <span class="font-medium">一键翻译</span>
            </button>
          </div>
        </div>
        <!-- /Component: ActionBar -->

        <!-- Component: SearchAndFilter -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 p-5 mb-6">
          <!-- 搜索栏 -->
          <div class="flex flex-col lg:flex-row lg:items-center gap-4 mb-5">
            <div class="flex-1 relative">
              <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input type="text" id="searchInput" placeholder="搜索网站名称..."
                     oninput="handleSearch()"
                     class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
            </div>
            <button onclick="toggleShowFavoritesOnly()" id="favoritesFilterBtn" class="inline-flex items-center px-4 py-3 text-gray-600 hover:text-pink-600 hover:bg-pink-50 rounded-xl transition-all border border-gray-200">
              <i class="far fa-heart mr-2"></i>
              <span>收藏 (0)</span>
            </button>
            <button onclick="toggleShowNotesOnly()" id="notesFilterBtn" class="inline-flex items-center px-4 py-3 text-gray-600 hover:text-yellow-600 hover:bg-yellow-50 rounded-xl transition-all border border-gray-200">
              <i class="far fa-sticky-note mr-2"></i>
              <span>备注 (0)</span>
            </button>
            <button onclick="toggleFilterPanel()" id="filterToggleBtn" class="inline-flex items-center px-4 py-3 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all border border-gray-200">
              <i class="fas fa-filter mr-2"></i>
              <span>筛选</span>
              <i class="fas fa-chevron-down ml-2 text-xs transition-transform" id="filterChevron"></i>
            </button>
            <button onclick="handleResetAll()" class="inline-flex items-center px-4 py-3 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all">
              <i class="fas fa-rotate-right mr-2"></i>
              <span>重置</span>
            </button>
            <button onclick="toggleTrendView()" id="trendViewBtn" class="inline-flex items-center px-4 py-3 text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all border border-gray-200" title="切换趋势视图">
              <i class="fas fa-chart-area mr-2"></i>
              <span>趋势</span>
            </button>
          </div>

          <!-- 筛选面板（可折叠） -->
          <div id="filterPanel" class="hidden border-t border-gray-100 pt-5">
            <div class="flex flex-wrap items-center gap-x-8 gap-y-4">
              <!-- Monthly Visit 筛选 -->
              <!-- Rank 筛选 -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-hashtag text-indigo-500"></i>
                  Rank
                </label>
                <input type="text" id="rankMin" placeholder="如 30" oninput="handleFilter()"
                       class="w-20 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <span class="text-gray-300">—</span>
                <input type="text" id="rankMax" placeholder="如 100" oninput="handleFilter()"
                       class="w-20 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
              </div>
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-eye text-blue-500"></i>
                  Monthly Visit
                </label>
                <input type="text" id="visitMin" placeholder="最小值 (如 1M)" oninput="handleFilter()"
                       class="w-36 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <span class="text-gray-300">—</span>
                <input type="text" id="visitMax" placeholder="最大值 (如 1B)" oninput="handleFilter()"
                       class="w-36 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
              </div>
              <!-- Growth 筛选 -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-chart-simple text-green-500"></i>
                  Growth
                </label>
                <input type="text" id="growthMin" placeholder="最小值" oninput="handleFilter()"
                       class="w-28 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <span class="text-gray-300">—</span>
                <input type="text" id="growthMax" placeholder="最大值" oninput="handleFilter()"
                       class="w-28 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
              </div>
              <!-- Growth Rate 筛选 -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-percent text-purple-500"></i>
                  Growth Rate
                </label>
                <input type="text" id="rateMin" placeholder="如 10%" oninput="handleFilter()"
                       class="w-24 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <span class="text-gray-300">—</span>
                <input type="text" id="rateMax" placeholder="如 50%" oninput="handleFilter()"
                       class="w-24 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
              </div>
              <!-- Change 筛选 -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-arrows-up-down text-orange-500"></i>
                  Change
                </label>
                <input type="text" id="changeMin" placeholder="如 -5" oninput="handleFilter()"
                       class="w-20 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <span class="text-gray-300">—</span>
                <input type="text" id="changeMax" placeholder="如 10" oninput="handleFilter()"
                       class="w-20 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer ml-2">
                  <input type="checkbox" id="includeNew" onchange="handleFilter()" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                  <span>包含 NEW</span>
                </label>
              </div>
            </div>
            <!-- 持续增长筛选 -->
            <div class="flex flex-wrap items-center gap-x-8 gap-y-4 mt-4 pt-4 border-t border-gray-100">
              <!-- Growth 增长 (Growth > 0) -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-chart-line text-emerald-500"></i>
                  Growth 增长
                </label>
                <select id="consecutiveGrowth" onchange="handleFilter()"
                        class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all cursor-pointer">
                  <option value="">不限</option>
                  <option value="2">连续 2 个月</option>
                  <option value="3">连续 3 个月</option>
                  <option value="4">连续 4 个月</option>
                </select>
              </div>
              <!-- Change 增长 (Change > 0) -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-ranking-star text-amber-500"></i>
                  Change 增长
                </label>
                <select id="consecutiveChange" onchange="handleFilter()"
                        class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all cursor-pointer">
                  <option value="">不限</option>
                  <option value="2">连续 2 个月</option>
                  <option value="3">连续 3 个月</option>
                  <option value="4">连续 4 个月</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <!-- /Component: SearchAndFilter -->

        <!-- Component: StatsBar -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-5 px-1">
          <div id="statsInfo" class="flex items-center gap-2 text-sm text-gray-500">
            <i class="fas fa-database text-gray-400"></i>
            共 0 条，筛选后 0 条
          </div>
          <div id="pageInfo" class="flex items-center gap-2 mt-2 md:mt-0 text-sm text-gray-500">
            <!-- 分页信息在这里动态渲染 -->
          </div>
        </div>
        <!-- /Component: StatsBar -->

        <!-- Component: DataTable -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead>
                <tr class="bg-gradient-to-r from-gray-50 to-gray-100/50 border-b border-gray-200">
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider w-16">#</th>
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider select-none">
                    <span class="flex items-center gap-2">
                      <i class="fas fa-globe text-cyan-400"></i>
                      WEB
                      <span id="sort-name" class="sort-arrows">
                        <i class="fas fa-caret-up" onclick="handleSort('name', 'asc')"></i>
                        <i class="fas fa-caret-down" onclick="handleSort('name', 'desc')"></i>
                      </span>
                    </span>
                  </th>
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider select-none">
                    <span class="flex items-center gap-2">
                      <i class="fas fa-eye text-blue-400"></i>
                      Monthly Visit
                      <span id="sort-month_visited_count" class="sort-arrows">
                        <i class="fas fa-caret-up" onclick="handleSort('month_visited_count', 'asc')"></i>
                        <i class="fas fa-caret-down" onclick="handleSort('month_visited_count', 'desc')"></i>
                      </span>
                    </span>
                  </th>
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider select-none">
                    <span class="flex items-center gap-2">
                      <i class="fas fa-chart-simple text-green-400"></i>
                      Growth
                      <span id="sort-growth" class="sort-arrows">
                        <i class="fas fa-caret-up" onclick="handleSort('growth', 'asc')"></i>
                        <i class="fas fa-caret-down" onclick="handleSort('growth', 'desc')"></i>
                      </span>
                    </span>
                  </th>
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider select-none">
                    <span class="flex items-center gap-2">
                      <i class="fas fa-percent text-purple-400"></i>
                      Growth Rate
                      <span id="sort-growth_rate" class="sort-arrows">
                        <i class="fas fa-caret-up" onclick="handleSort('growth_rate', 'asc')"></i>
                        <i class="fas fa-caret-down" onclick="handleSort('growth_rate', 'desc')"></i>
                      </span>
                    </span>
                  </th>
                  <th class="px-5 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-20 select-none">
                    <span class="flex items-center justify-center gap-1">
                      <i class="fas fa-arrows-up-down text-orange-400"></i>
                      Change
                      <span id="sort-rank_change" class="sort-arrows">
                        <i class="fas fa-caret-up" onclick="handleSort('rank_change', 'asc')"></i>
                        <i class="fas fa-caret-down" onclick="handleSort('rank_change', 'desc')"></i>
                      </span>
                    </span>
                  </th>
                  <th class="px-5 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-16">
                    <i class="fas fa-sticky-note text-yellow-400"></i>
                  </th>
                  <th class="px-5 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-16">
                    <i class="fas fa-heart text-pink-400"></i>
                  </th>
                </tr>
              </thead>
              <tbody id="tableBody" class="divide-y divide-gray-100">
                <!-- 数据行在这里动态渲染 -->
              </tbody>
            </table>
          </div>

          <!-- 空状态 -->
          <div id="emptyState" class="py-20 text-center">
            <div class="w-20 h-20 bg-gradient-to-br from-gray-100 to-gray-200 rounded-full flex items-center justify-center mx-auto mb-5">
              <i class="fas fa-inbox text-3xl text-gray-400"></i>
            </div>
            <p class="text-gray-500 mb-2">暂无数据</p>
            <p class="text-sm text-gray-400">请上传 JSON 文件或粘贴数据</p>
          </div>
        </div>
        <!-- /Component: DataTable -->

        <!-- Component: Pagination -->
        <div id="pagination" class="flex items-center justify-center gap-2 mt-8">
          <!-- 分页按钮在这里动态渲染 -->
        </div>
        <!-- /Component: Pagination -->

      </div>
    </div>
  </main>

  <!-- 个人中心视图 -->
  <main id="personalCenterView" class="max-w-8xl mx-auto px-6 py-8 hidden">
    <div class="flex flex-col lg:flex-row gap-8">

      <!-- 左侧：月份筛选 -->
      <aside class="lg:w-52 flex-shrink-0">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 overflow-hidden lg:sticky lg:top-24">
          <div class="p-4 bg-gradient-to-r from-indigo-600 to-purple-600">
            <div class="flex items-center gap-2 text-white">
              <i class="fas fa-filter"></i>
              <span class="font-semibold">筛选月份</span>
            </div>
          </div>
          <div id="pcMonthList" class="max-h-96 overflow-y-auto">
            <!-- 月份列表由 JS 动态渲染 -->
          </div>
        </div>
      </aside>

      <!-- 右侧主内容区 -->
      <div class="flex-1 min-w-0">

        <!-- 页面标题和 Tab 筛选 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 p-5 mb-6">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/25">
                <i class="fas fa-user text-white text-lg"></i>
              </div>
              <div>
                <h2 class="text-lg font-bold text-gray-900">个人中心</h2>
                <p class="text-sm text-gray-500">管理你的收藏和备注</p>
              </div>
            </div>
            <!-- Tab 筛选 -->
            <div class="flex items-center gap-2 bg-gray-100 rounded-xl p-1">
              <button onclick="setPCTab('all')" id="pcTabAll" class="px-4 py-2 text-sm font-medium rounded-lg transition-all bg-white text-indigo-600 shadow-sm">
                全部
              </button>
              <button onclick="setPCTab('favorites')" id="pcTabFavorites" class="px-4 py-2 text-sm font-medium rounded-lg transition-all text-gray-600 hover:text-indigo-600">
                <i class="fas fa-heart text-pink-500 mr-1.5"></i>收藏
              </button>
              <button onclick="setPCTab('notes')" id="pcTabNotes" class="px-4 py-2 text-sm font-medium rounded-lg transition-all text-gray-600 hover:text-indigo-600">
                <i class="fas fa-sticky-note text-yellow-500 mr-1.5"></i>备注
              </button>
            </div>
          </div>
        </div>

        <!-- 统计信息 -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-5 px-1">
          <div id="pcStatsInfo" class="flex items-center gap-2 text-sm text-gray-500">
            <i class="fas fa-database text-gray-400"></i>
            共 0 条
          </div>
          <div id="pcPageInfo" class="flex items-center gap-2 mt-2 md:mt-0 text-sm text-gray-500">
            <!-- 分页信息在这里动态渲染 -->

  <script>
    // ==================== 榜单配置（可扩展） ====================
    const RANKING_CONFIG = {
      traffic: {
        name: '流量增长榜',
        storageKey: 'website_ranking_data',
        icon: 'fa-chart-line',
        color: 'blue',           // tailwind 颜色前缀
        gradient: 'from-blue-600 to-indigo-600',
        rankBy: 'growth',        // 排序依据：growth=按增长值，order=按上传顺序
        isMain: true,            // 是否为主榜（总榜）
        syncToMain: false        // 是否同步到主榜
      },
      revenue: {
        name: '收入榜',
        storageKey: 'websiteRevenueData',
        icon: 'fa-dollar-sign',
        color: 'green',
        gradient: 'from-green-600 to-emerald-600',
        rankBy: 'order',
        isMain: false,
        syncToMain: true
      }
      // 未来扩展示例：
      // category: { name: '网站分类榜', storageKey: 'websiteCategoryData', ... }
      // region: { name: '流量地区榜', storageKey: 'websiteRegionData', ... }
      // source: { name: '流量来源榜', storageKey: 'websiteSourceData', ... }
    };

    // ==================== 状态管理 ====================
    const STORAGE_KEY = 'website_ranking_data';  // 保留兼容性
    const PAGE_SIZE = 300;

    let state = {
      // 所有榜单数据统一存储
      rankings: {
        traffic: {},   // 流量增长榜数据
        revenue: {}    // 收入榜数据
        // 未来扩展时在此添加
      },
      // 兼容性别名（指向 rankings 中的数据）
      get allData() { return this.rankings.traffic; },
      set allData(val) { this.rankings.traffic = val; },
      get revenueData() { return this.rankings.revenue; },
      set revenueData(val) { this.rankings.revenue = val; },
      currentRankingType: 'traffic',  // 当前榜单类型
      currentMonth: '',
      filteredData: [],
      currentPage: 1,
      sortField: 'growth',
      sortOrder: 'desc',
      searchKeyword: '',
      filterPanelOpen: false,
      filters: {
        rankMin: null,
        rankMax: null,
        visitMin: null,
        visitMax: null,
        growthMin: null,
        growthMax: null,
        rateMin: null,
        rateMax: null,
        changeMin: null,
        changeMax: null,
        includeNew: false,
        consecutiveChange: null,  // 连续排名上升月数
        consecutiveGrowth: null   // 连续增长月数
      },
      favorites: {},  // 按月份存储收藏 { "2025-11": ["handle1"], ... }，从服务器加载
      showFavoritesOnly: false,  // 是否只显示收藏
      showNotesOnly: false,  // 是否只显示有备注的
      translations: {},  // 翻译缓存 { "原文": "译文" }
      isTranslated: false,  // 是否已翻译
      notes: {},  // 备注 { "handle": "备注内容" }，从服务器加载
      monthNotes: {},  // 月份备注 { "2025-11": "备注内容" }，从服务器加载
      showTrendView: false,  // 是否展开趋势视图，从服务器加载
      // 个人中心状态
      showPersonalCenter: false,  // 是否显示个人中心
      pcTab: 'all',  // 个人中心当前 Tab: 'all' | 'favorites' | 'notes'
      pcMonth: 'all',  // 个人中心月份筛选: 'all' | '2025-11' | ...
      pcFilteredData: [],  // 个人中心筛选后的数据
      pcCurrentPage: 1  // 个人中心当前页码
    };

    // ==================== 榜单工具函数 ====================

    // 获取当前榜单配置
    function getCurrentConfig() {
      return RANKING_CONFIG[state.currentRankingType];
    }

    // 获取当前榜单的数据源
    function getCurrentData() {
      return state.rankings[state.currentRankingType];
    }

    // 获取指定榜单的存储 key
    function getStorageKey(rankingType) {
      return RANKING_CONFIG[rankingType]?.storageKey || STORAGE_KEY;
    }

    // 获取主榜类型（isMain=true 的榜单）
    function getMainRankingType() {
      return Object.keys(RANKING_CONFIG).find(key => RANKING_CONFIG[key].isMain) || 'traffic';
    }

    // ==================== 工具函数 ====================

    // 更新顶部统计信息（总榜数据：月份数 + 去重网站数）
    function updateHeaderStats() {
      const months = Object.keys(state.allData);
      const monthCount = months.length;

      // 统计去重的网站数量（按 handle 去重）
      const uniqueHandles = new Set();
      months.forEach(month => {
        const websites = state.allData[month] || [];
        websites.forEach(site => {
          if (site.handle) {
            uniqueHandles.add(site.handle);
          }
        });
      });
      const websiteCount = uniqueHandles.size;

      const statsEl = document.getElementById('headerStats');
      if (statsEl) {
        statsEl.textContent = `共 ${monthCount} 个月 · ${websiteCount} 个网站`;
      }
    }

    // 解析数值输入（支持 100M, 100K, 10% 格式）
    function parseValueInput(value) {
      if (!value || value.trim() === '') return null;

      const str = value.trim().toUpperCase();

      // 处理百分比
      if (str.endsWith('%')) {
        const num = parseFloat(str.slice(0, -1));
        return isNaN(num) ? null : num / 100;
      }

      // 处理 B（十亿）
      if (str.endsWith('B')) {
        const num = parseFloat(str.slice(0, -1));
        return isNaN(num) ? null : num * 1000000000;
      }

      // 处理 M（百万）
      if (str.endsWith('M')) {
        const num = parseFloat(str.slice(0, -1));
        return isNaN(num) ? null : num * 1000000;
      }

      // 处理 K（千）
      if (str.endsWith('K')) {
        const num = parseFloat(str.slice(0, -1));
        return isNaN(num) ? null : num * 1000;
      }

      // 纯数字
      const num = parseFloat(str);
      return isNaN(num) ? null : num;
    }

    // 格式化数值显示
    function formatNumber(num) {
      if (num === undefined || num === null) return '0';
      if (num >= 1000000000) {
        return (num / 1000000000).toFixed(2) + 'B';
      } else if (num >= 1000000) {
        return (num / 1000000).toFixed(2) + 'M';
      } else if (num >= 1000) {
        return (num / 1000).toFixed(2) + 'K';
      }
      return num.toString();
    }

    // 格式化增长率
    function formatRate(rate) {
      if (rate === undefined || rate === null) return '+0.00%';
      const percent = (rate * 100).toFixed(2);
      return rate >= 0 ? `+${percent}%` : `${percent}%`;
    }

    // 格式化增长值
    function formatGrowth(growth) {
      if (growth === undefined || growth === null) return '+0';
      const formatted = formatNumber(Math.abs(growth));
      return growth >= 0 ? `+${formatted}` : `-${formatted}`;
    }

    // 从日期字符串提取月份
    function extractMonth(dateStr) {
      if (!dateStr) return null;
      const match = dateStr.match(/^(\d{4}-\d{2})/);
      return match ? match[1] : null;
    }

    // 显示 Toast 消息
    function showToast(message, type = 'success', persistent = false) {
      const toast = document.getElementById('toast');
      const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
      const bgColor = type === 'success' ? 'bg-gradient-to-r from-green-500 to-emerald-500' :
                      type === 'error' ? 'bg-gradient-to-r from-red-500 to-rose-500' :
                      'bg-gradient-to-r from-gray-700 to-gray-800';

      toast.className = `fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-2xl transform transition-all duration-300 z-50 flex items-center gap-3 text-white ${bgColor}`;

      if (persistent) {
        // 需要手动关闭的通知，添加关闭按钮
        toast.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span><button onclick="hideToast()" class="ml-2 hover:bg-white/20 rounded-full w-6 h-6 flex items-center justify-center"><i class="fas fa-times text-sm"></i></button>`;
      } else {
        toast.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
      }

      setTimeout(() => {
        toast.classList.remove('translate-y-20', 'opacity-0');
      }, 10);

      // 非持久通知自动消失
      if (!persistent) {
        setTimeout(() => {
          toast.classList.add('translate-y-20', 'opacity-0');
        }, 3000);
      }
    }

    function hideToast() {
      const toast = document.getElementById('toast');

    // 显示详细的导入结果通知（需要手动关闭）
    function showImportResult(rankingType, month, stats) {
      const config = RANKING_CONFIG[rankingType];
      const toast = document.getElementById('toast');

      // 构建通知内容
      let lines = [];
      lines.push(`<div class="font-semibold text-base mb-1">${config.name} ${month} 导入成功</div>`);

      // 基本统计
      let basicInfo = `共 ${stats.total} 条`;
      if (stats.newCount > 0 || stats.updateCount > 0) {
        const parts = [];
        if (stats.newCount > 0) parts.push(`新增 ${stats.newCount}`);
        if (stats.updateCount > 0) parts.push(`更新 ${stats.updateCount}`);
        basicInfo = parts.join('，') + `，${basicInfo}`;
      }
      lines.push(`<div class="text-sm opacity-90">📊 ${basicInfo}</div>`);

      // 同步信息
      if (stats.syncResult && stats.syncResult.syncedCount > 0) {
        lines.push(`<div class="text-sm opacity-90">🔄 已同步 ${stats.syncResult.syncedCount} 条到${stats.syncResult.targetName}</div>`);
      }

      // 数据质量警告
      const warnings = [];
      if (stats.missingFields.website_name > 0) {
        warnings.push(`${stats.missingFields.website_name} 条缺少网站名称`);
      }
      if (stats.missingFields.growth > 0) {
        warnings.push(`${stats.missingFields.growth} 条缺少增长数据`);
      }
      if (stats.missingFields.month_visited_count > 0) {
        warnings.push(`${stats.missingFields.month_visited_count} 条缺少访问量`);
      }
      if (warnings.length > 0) {
        lines.push(`<div class="text-sm text-yellow-200 mt-1">⚠️ ${warnings.join('，')}</div>`);
      }

      toast.className = 'fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-2xl transform transition-all duration-300 z-50 text-white bg-gradient-to-r from-green-500 to-emerald-500';
      toast.innerHTML = `
        <div class="flex items-start gap-3">
          <i class="fas fa-check-circle mt-1"></i>
          <div class="flex-1">${lines.join('')}</div>
          <button onclick="hideToast()" class="ml-2 hover:bg-white/20 rounded-full w-6 h-6 flex items-center justify-center flex-shrink-0">
            <i class="fas fa-times text-sm"></i>
          </button>
        </div>
      `;

      setTimeout(() => {
        toast.classList.remove('translate-y-20', 'opacity-0');
      }, 10);
    }

    // 处理 JSON 数据（共用逻辑）
    function processJsonData(json) {
      // 处理嵌套的 data.data 结构（API 响应格式）
      if (json.data && json.data.data && Array.isArray(json.data.data)) {
        json = { ...json, data: json.data.data };
      }

      if (!json.data || !Array.isArray(json.data)) {
        throw new Error('JSON 格式错误：缺少 data 数组');
      }

      if (json.data.length === 0) {
        throw new Error('数据为空');
      }

      const firstItem = json.data[0];

      // 尝试从 date 字段提取月份（优先使用原始字段）
      let month = null;
      if (firstItem.date) {
        month = extractMonth(firstItem.date);
      }

      // 如果没有月份，弹窗让用户选择
      if (!month) {
        openMonthSelectModal(json);
        return;
      }

      processJsonDataWithMonth(json, month);
    }

    // 使用指定月份处理 JSON 数据
    function processJsonDataWithMonth(json, month) {
      // 统计数据质量（在规范化之前）
      const missingFields = { website_name: 0, growth: 0, month_visited_count: 0 };

      // 规范化数据格式：优先使用原字段，没有再从兼容字段提取
      json.data = json.data.map(item => {
        const normalized = { ...item };

        // 从 traffic 对象提取数据（作为兜底）
        const traffic = item.traffic || {};

        // 统计原始数据中缺少的字段
        if (!item.website_name) missingFields.website_name++;

        // month_visited_count：顶层优先
        if (normalized.month_visited_count === undefined) {
          const trafficSum = (traffic.monthly_visits_direct || 0) +
                             (traffic.monthly_visits_search || 0) +
                             (traffic.monthly_visits_social || 0) +
                             (traffic.monthly_visits_referrals || 0) +
                             (traffic.monthly_visits_mail || 0);
          normalized.month_visited_count = trafficSum || 0;
          // 如果原始数据和 traffic 都没有访问量数据
          if (item.month_visited_count === undefined && trafficSum === 0) {
            missingFields.month_visited_count++;
          }
        }

        // growth：顶层优先 > traffic.growth
        if (normalized.growth === undefined) {
          normalized.growth = traffic.growth !== undefined ? traffic.growth : 0;
          // 如果原始数据和 traffic 都没有增长数据
          if (item.growth === undefined && traffic.growth === undefined) {
            missingFields.growth++;
          }
        }

        // growth_rate：顶层优先 > traffic.growth_rate
        if (normalized.growth_rate === undefined) {
          normalized.growth_rate = traffic.growth_rate !== undefined ? traffic.growth_rate : 0;
        }

        // tags：顶层优先 > 从 categories 提取 name
        if (!normalized.tags || normalized.tags.length === 0) {
          if (item.categories && Array.isArray(item.categories)) {
            normalized.tags = item.categories.map(cat => cat.name).slice(0, 6);
          } else {
            normalized.tags = [];
          }
        }

        // description：顶层优先 > what_is_summary
        if (!normalized.description) {
          normalized.description = item.what_is_summary || '';
        }

        // website_name：标准化网站名称字段
        if (!normalized.website_name) {
          normalized.website_name = item.name || '';
        }

        return normalized;
      });

      // 合并并去重数据（按 handle 去重，新数据优先）
      const existingData = state.allData[month] || [];
      const existingMap = new Map();

      // 先加入已有数据
      existingData.forEach(item => {
        if (item.handle) {
          existingMap.set(item.handle, item);
        }
      });

      // 新数据覆盖已有数据（按 handle）
      let newCount = 0;
      let updateCount = 0;
      json.data.forEach(item => {
        if (item.handle) {
          if (existingMap.has(item.handle)) {
            updateCount++;
          } else {
            newCount++;
          }
          existingMap.set(item.handle, item);
        }
      });

      // 转换回数组
      state.allData[month] = Array.from(existingMap.values());
      state.currentMonth = month;

      // 处理 favorites 字段（如果存在则合并到该月份）
      if (json.favorites && Array.isArray(json.favorites)) {
        if (!state.favorites[month]) {
          state.favorites[month] = [];
        }
        const existing = state.favorites[month];
        const newFavorites = [...new Set([...existing, ...json.favorites])];
        const addedCount = newFavorites.length - existing.length;
        state.favorites[month] = newFavorites;
        if (addedCount > 0) {
          showToast(`同时导入了 ${addedCount} 个收藏`);
        }
      }

      // 处理 notes 字段（全局合并，新备注覆盖旧备注）
      if (json.notes && typeof json.notes === 'object') {
        let notesAddedCount = 0;
        Object.entries(json.notes).forEach(([handle, note]) => {
          if (note && !state.notes[handle]) {
            notesAddedCount++;
          }
          if (note) {
            state.notes[handle] = note;
          }
        });
        if (notesAddedCount > 0) {
          showToast(`同时导入了 ${notesAddedCount} 个备注`);
        }
      }

      // 保存收藏和备注到服务器
      saveFavoritesAndNotes();

      saveToStorage();
      updateMonthSelect();

      resetFiltersAndSort();
      applyFiltersAndRender();
      updateFavoritesButton();
      updateNotesButton();

      // 显示导入结果（需要手动关闭）
      const totalCount = state.allData[month].length;
      const stats = {
        total: totalCount,
        newCount: newCount,
        updateCount: updateCount,
        missingFields: missingFields,
        syncResult: null
      };
      showImportResult('traffic', month, stats);
    }

    // 尝试修复并解析 JSON
    function tryParseJson(text) {
      let content = text.trim();

      // 预处理：替换中文标点符号为英文标点
      content = content
        .replace(/[""]/g, '"')      // 中文引号 → 英文引号
        .replace(/['']/g, "'")      // 中文单引号 → 英文单引号
        .replace(/，/g, ',')        // 中文逗号 → 英文逗号
        .replace(/：/g, ':')        // 中文冒号 → 英文冒号
        .replace(/；/g, ';')        // 中文分号 → 英文分号
        .replace(/【/g, '[')        // 中文方括号
        .replace(/】/g, ']')
        .replace(/（/g, '(')        // 中文圆括号
        .replace(/）/g, ')');

      // 预处理：移除末尾多余的逗号（如 ], 或 }, 或单独的 ,）
      content = content
        .replace(/,\s*$/g, '')      // 移除末尾的逗号
        .replace(/,\s*}/g, '}')     // 移除 } 前的逗号
        .replace(/,\s*]/g, ']');    // 移除 ] 前的逗号

      // 1. 直接尝试解析
      try {
        return JSON.parse(content);
      } catch (e) {
        // 继续尝试修复
      }

      // 2. 如果以 "data": 开头，补充外层大括号
      if (content.startsWith('"data"')) {
        try {
          return JSON.parse('{' + content + '}');
        } catch (e) {
          // 继续尝试
        }
      }

      // 3. 如果以 [ 开头，可能是纯数组，包装成 { data: [...] }
      if (content.startsWith('[')) {
        try {
          const arr = JSON.parse(content);
          if (Array.isArray(arr)) {
            return { data: arr };
          }
        } catch (e) {
          // 继续尝试
        }
      }

      // 4. 如果以 "data": 开头，尝试各种修复组合
      if (content.startsWith('"data"')) {
        // 可能末尾缺少 } 或有其他问题
        let fixed = '{' + content;
        if (!fixed.endsWith('}')) {
          fixed = fixed + '}';
        }
        try {
          return JSON.parse(fixed);
        } catch (e) {
          // 继续尝试
        }
      }

      // 5. 兜底方案：用正则提取关键字段
      const extractedData = extractDataFromText(content);
      if (extractedData.length > 0) {
        return { data: extractedData };
      }

      // 所有修复尝试失败，抛出原始错误
      throw new Error('JSON 格式无法解析，请检查格式是否正确');
    }

    // 从文本中提取关键字段（兜底方案）
    function extractDataFromText(text) {
      const items = [];

      // 提取字符串值的辅助函数
      const extractString = (text, key) => {
        // 匹配 "key": "value" 或 "key": 'value'
        const regex = new RegExp(`"${key}"\\s*:\\s*"([^"]*)"`, 'i');
        const match = text.match(regex);
        return match ? match[1] : null;
      };

      // 提取数字值的辅助函数
      const extractNumber = (text, key) => {
        const regex = new RegExp(`"${key}"\\s*:\\s*(-?[\\d.]+)`, 'i');
        const match = text.match(regex);
        return match ? parseFloat(match[1]) : null;
      };

      // 提取数组值的辅助函数（简单字符串数组）
      const extractStringArray = (text, key) => {
        const regex = new RegExp(`"${key}"\\s*:\\s*\\[([^\\]]*?)\\]`, 'i');
        const match = text.match(regex);
        if (!match) return [];
        // 提取数组中的字符串
        const arrayContent = match[1];
        const strRegex = /"([^"]*)"/g;
        const result = [];
        let strMatch;
        while ((strMatch = strRegex.exec(arrayContent)) !== null) {
          result.push(strMatch[1]);
        }
        return result;
      };

      // 使用平衡括号匹配提取每个对象
      // 查找所有包含 "handle": 的对象块
      let depth = 0;
      let start = -1;
      let inString = false;
      let prevChar = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];

        // 处理字符串内部
        if (char === '"' && prevChar !== '\\') {
          inString = !inString;
        }

        if (!inString) {
          if (char === '{') {
            if (depth === 0) {
              start = i;
            }
            depth++;
          } else if (char === '}') {
            depth--;
            if (depth === 0 && start !== -1) {
              // 找到一个完整的对象
              const objText = text.substring(start, i + 1);

              // 检查是否包含关键字段 handle
              if (objText.includes('"handle"')) {
                const handle = extractString(objText, 'handle');
                const name = extractString(objText, 'name');

                // 必须有 handle 和 name
                if (handle && name) {
                  const item = {
                    handle,
                    name,
                    description: extractString(objText, 'description') || extractString(objText, 'what_is_summary') || '',
                    month_visited_count: extractNumber(objText, 'month_visited_count') || 0,
                    growth: extractNumber(objText, 'growth') || 0,
                    growth_rate: extractNumber(objText, 'growth_rate') || 0,
                    tags: extractStringArray(objText, 'tags'),
                    date: extractString(objText, 'date') || ''  // 只匹配 date 字段，没有则让用户选择
                  };

                  // 如果 tags 为空，尝试从 categories 提取
                  if (item.tags.length === 0) {
                    // 简单提取 categories 中的 name
                    const catRegex = /"categories"\s*:\s*\[([\s\S]*?)\]/;
                    const catMatch = objText.match(catRegex);
                    if (catMatch) {
                      const catNameRegex = /"name"\s*:\s*"([^"]*)"/g;
                      let catNameMatch;
                      while ((catNameMatch = catNameRegex.exec(catMatch[1])) !== null) {
                        // 排除 "Features", "Pricing" 等非分类名
                        if (!['Features', 'Pricing', 'Website', 'Free', 'Freemium'].includes(catNameMatch[1])) {
                          item.tags.push(catNameMatch[1]);
                        }
                      }
                      item.tags = item.tags.slice(0, 6);
                    }
                  }

                  // 尝试从 traffic 对象提取 growth 和 growth_rate
                  if (item.growth === 0 || item.growth_rate === 0) {
                    const trafficRegex = /"traffic"\s*:\s*\{([\s\S]*?)\}/;
                    const trafficMatch = objText.match(trafficRegex);
                    if (trafficMatch) {
                      const trafficText = trafficMatch[1];
                      if (item.growth === 0) {
                        const tGrowth = extractNumber(trafficText, 'growth');
                        if (tGrowth !== null) item.growth = tGrowth;
                      }
                      if (item.growth_rate === 0) {
                        const tRate = extractNumber(trafficText, 'growth_rate');
                        if (tRate !== null) item.growth_rate = tRate;
                      }
                    }
                  }

                  items.push(item);
                }
              }
              start = -1;
            }
          }
        }
        prevChar = char;
      }

      return items;
    }

    // 上传 JSON 文件
    function handleUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const json = tryParseJson(e.target.result);
          processJsonData(json);
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      reader.readAsText(file);
      event.target.value = '';
    }

    // 重新计算指定月份的排名（主榜，按 growth 排序）
    function recalculateRanks(month) {
      const data = state.allData[month];
      if (!data) return;

      // 按 growth 降序排序（与显示逻辑一致）
      data.sort((a, b) => (b.growth || 0) - (a.growth || 0));

      // 获取上月数据计算 change（上月也按 growth 排序）
      const prevMonth = getPrevMonth(month);
      const prevData = state.allData[prevMonth] || [];
      const prevRankMap = {};
      [...prevData].sort((a, b) => (b.growth || 0) - (a.growth || 0)).forEach((item, index) => {
        prevRankMap[item.handle] = index + 1;
      });

      // 更新 rank 和 change
      data.forEach((item, index) => {
        item.rank = index + 1;
        const prevRank = prevRankMap[item.handle];
        item.change = prevRank ? prevRank - item.rank : null;
      });
    }

    // 获取上一个月份
    function getPrevMonth(month) {
      const [year, m] = month.split('-').map(Number);
      const prevDate = new Date(year, m - 2, 1);  // 月份是 0-indexed
      return `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;
    }

    // 渲染榜单 Tabs（从配置动态生成）
    function renderRankingTabs() {
      const container = document.getElementById('rankingTabs');
      if (!container) return;

      container.innerHTML = Object.entries(RANKING_CONFIG).map(([key, config]) => {
        const isActive = state.currentRankingType === key;
        const activeClass = isActive
          ? `bg-gradient-to-r ${config.gradient} text-white shadow-lg`
          : 'text-gray-600 hover:bg-gray-100';

        return `
          <button onclick="switchRankingType('${key}')" id="${key}TabBtn"
                  class="flex-1 px-6 py-3 rounded-xl font-medium transition-all ${activeClass}">
            <i class="fas ${config.icon} mr-2"></i>${config.name}
          </button>
        `;
      }).join('');
    }

    // 更新上传按钮样式和文字（跟随当前榜单）
    function updateUploadButton() {
      const config = getCurrentConfig();
      const uploadBtn = document.getElementById('uploadBtn');
      const uploadBtnText = document.getElementById('uploadBtnText');

      if (uploadBtn && config) {
        // 更新按钮渐变色
        uploadBtn.className = `inline-flex items-center px-5 py-2.5 bg-gradient-to-r ${config.gradient} text-white rounded-xl cursor-pointer hover:opacity-90 transition-all shadow-lg shadow-${config.color}-500/25 hover:shadow-${config.color}-500/40 hover:scale-105`;
      }
      if (uploadBtnText) {
        uploadBtnText.textContent = '上传 JSON';
      }
    }

    // 处理当前榜单的上传（根据当前榜单类型分发）
    function handleCurrentRankingUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const json = tryParseJson(e.target.result);

          if (state.currentRankingType === 'traffic') {
            // 流量榜使用原有逻辑
            processJsonData(json);
          } else {
            // 其他榜单使用通用处理逻辑
            processRankingData(state.currentRankingType, json);
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      reader.readAsText(file);
      event.target.value = '';
    }

    // 通用榜单数据处理（适用于非主榜的榜单）
    function processRankingData(rankingType, json) {
      const config = RANKING_CONFIG[rankingType];

      // 检测是否有 data 字段（支持包装格式和嵌套的 API 响应格式）
      let rawData = json.data || json;
      // 处理嵌套的 data.data 结构（API 响应格式）
      if (rawData && rawData.data && (Array.isArray(rawData.data) || typeof rawData.data === 'object')) {
        rawData = rawData.data;
      }

      // 执行实际的数据处理
      const doProcess = () => {
        if (Array.isArray(rawData)) {
          const month = extractMonth(rawData[0]?.date);
          if (!month) {
            openMonthSelectModalForRanking(rankingType, rawData);
            return;
          }
          const stats = processRankingMonthData(rankingType, month, rawData);
          showImportResult(rankingType, month, stats);
        } else if (typeof rawData === 'object') {
          let totalStats = { total: 0, newCount: 0, updateCount: 0, missingFields: { website_name: 0, growth: 0, month_visited_count: 0 }, syncResult: null };
          let lastMonth = '';
          Object.entries(rawData).forEach(([month, data]) => {
            if (Array.isArray(data)) {
              const stats = processRankingMonthData(rankingType, month, data);
              totalStats.total += stats.total;
              totalStats.newCount += stats.newCount;
              totalStats.updateCount += stats.updateCount;
              totalStats.missingFields.website_name += stats.missingFields.website_name;
              totalStats.missingFields.growth += stats.missingFields.growth;
              totalStats.missingFields.month_visited_count += stats.missingFields.month_visited_count;
              if (stats.syncResult) totalStats.syncResult = stats.syncResult;
              lastMonth = month;
            }
          });
          showImportResult(rankingType, lastMonth || '多月份', totalStats);
        }

        saveRankingToStorage(rankingType);

        if (state.currentRankingType === rankingType) {
          updateMonthSelect();
          applyFiltersAndRender();
        }
      };

      // 检查是否会覆盖已有数据
      const existingMonths = [];
      if (Array.isArray(rawData)) {
        const month = extractMonth(rawData[0]?.date);
        if (month && state.rankings[rankingType][month]?.length > 0) {
          existingMonths.push(month);
        }
      } else if (typeof rawData === 'object') {
        Object.keys(rawData).forEach(month => {
          if (state.rankings[rankingType][month]?.length > 0) {
            existingMonths.push(month);
          }
        });
      }

      // 如果有已有数据，弹出确认框
      if (existingMonths.length > 0) {
        const monthsStr = existingMonths.join('、');
        const message = `<strong>${config.name}</strong> 的以下月份已有数据：<br><br><span class="text-amber-600 font-medium">${monthsStr}</span><br><br>继续操作将覆盖这些月份的数据。`;
        openOverwriteConfirmModal(message, doProcess);
      } else {
        doProcess();
      }
    }

    // 处理单个月份的榜单数据（通用逻辑，按上传顺序排名）
    // 返回统计信息：{ total, newCount, updateCount, missingFields, syncResult }
    function processRankingMonthData(rankingType, month, data) {
      const config = RANKING_CONFIG[rankingType];
      const stats = {
        total: data.length,
        newCount: 0,
        updateCount: 0,
        missingFields: { website_name: 0, growth: 0, month_visited_count: 0 },
        syncResult: null
      };

      // 获取当前月份已有数据用于判断新增/更新
      const existingData = state.rankings[rankingType][month] || [];
      const existingHandles = new Set(existingData.map(item => item.handle));

      // 获取上个月数据用于计算 change
      const prevMonth = getPrevMonth(month);
      const prevData = state.rankings[rankingType][prevMonth] || [];
      const prevRankMap = {};
      prevData.forEach(item => {
        prevRankMap[item.handle] = item.rank;
      });

      // 为数据添加 rank 和 change，并标准化字段
      const processedData = data.map((item, index) => {
        const rank = index + 1;  // 根据顺序生成排名
        const prevRank = prevRankMap[item.handle];
        const change = prevRank ? prevRank - rank : null;  // 上月排名 - 本月排名

        // 统计新增/更新
        if (existingHandles.has(item.handle)) {
          stats.updateCount++;
        } else {
          stats.newCount++;
        }

        // 统计缺失字段（同时检查顶层和 traffic 对象）
        const traffic = item.traffic || {};
        if (!item.website_name) stats.missingFields.website_name++;
        // growth：顶层或 traffic.growth
        const hasGrowth = item.growth !== undefined || traffic.growth !== undefined;
        if (!hasGrowth) stats.missingFields.growth++;
        // month_visited_count：顶层或从 traffic 计算
        const hasVisitCount = item.month_visited_count !== undefined ||
          (traffic.monthly_visits_direct || traffic.monthly_visits_search || traffic.monthly_visits_social || traffic.monthly_visits_referrals || traffic.monthly_visits_mail);
        if (!hasVisitCount) stats.missingFields.month_visited_count++;

        // 标准化 website_name 字段：优先使用 website_name
        const websiteName = item.website_name || item.name || '';

        // 从 traffic 对象提取数据到顶层（如果顶层没有）
        const growth = item.growth !== undefined ? item.growth : (traffic.growth || 0);
        const growthRate = item.growth_rate !== undefined ? item.growth_rate : (traffic.growth_rate || 0);
        const monthVisitedCount = item.month_visited_count !== undefined ? item.month_visited_count :
          ((traffic.monthly_visits_direct || 0) + (traffic.monthly_visits_search || 0) +
           (traffic.monthly_visits_social || 0) + (traffic.monthly_visits_referrals || 0) +
           (traffic.monthly_visits_mail || 0)) || 0;

        return {
          ...item,
          website_name: websiteName,
          growth,
          growth_rate: growthRate,
          month_visited_count: monthVisitedCount,
          rank,
          change,
          isNew: !prevRank
        };
      });

      // 存储到对应榜单数据（覆盖）
      state.rankings[rankingType][month] = processedData;

      // 如果配置为同步到主榜
      if (config.syncToMain) {
        const mainType = getMainRankingType();
        stats.syncResult = syncToMainRanking(mainType, month, processedData);
      }

      return stats;
    }

    // 同步数据到主榜（只新增不存在的网站）
    // 返回同步统计：{ targetName, syncedCount, skippedCount }
    function syncToMainRanking(mainType, month, sourceData) {
      const targetName = RANKING_CONFIG[mainType].name;

      // 如果主榜该月份没有数据，全部同步
      if (!state.rankings[mainType][month] || state.rankings[mainType][month].length === 0) {
        state.rankings[mainType][month] = sourceData.map(item => ({
          ...item,
          rank: null,
          change: null
        }));
        recalculateRanks(month);
        saveRankingToStorage(mainType);
        console.log(`[榜单同步] ${month} 全部同步 ${sourceData.length} 个网站到${targetName}`);
        return { targetName, syncedCount: sourceData.length, skippedCount: 0 };
      }

      // 主榜有数据，只添加不存在的网站
      const existingHandles = new Set(state.rankings[mainType][month].map(item => item.handle));
      let addedCount = 0;
      let skippedCount = 0;

      sourceData.forEach(item => {
        if (!existingHandles.has(item.handle)) {
          state.rankings[mainType][month].push({
            ...item,
            rank: null,
            change: null
          });
          addedCount++;
        } else {
          skippedCount++;
        }
      });

      if (addedCount > 0) {
        recalculateRanks(month);
        saveRankingToStorage(mainType);
        console.log(`[榜单同步] ${month} 新增 ${addedCount} 个网站到${targetName}`);
      }

      return { targetName, syncedCount: addedCount, skippedCount };
    }

    // 切换榜单类型
    function switchRankingType(type) {
      if (state.currentRankingType === type) return;

      state.currentRankingType = type;
      state.currentPage = 1;

      // 重新渲染 Tabs 以更新选中状态
      renderRankingTabs();

      // 更新功能区按钮
      updateUploadButton();

      if (!confirm(`确定要清空 ${typeLabel} ${state.currentMonth} 的数据吗？此操作不可恢复。`)) {

        // 迁移当前月份的收藏到其他月份
        const favoritesToMigrate = state.favorites[monthToDelete] || [];
        delete state.favorites[monthToDelete];

        if (favoritesToMigrate.length > 0) {
          // 找到其他存在的月份（优先最近的）
          const otherMonths = Object.keys(state.allData).sort().reverse();
          if (otherMonths.length > 0) {
            const targetMonth = otherMonths[0];

            // 合并收藏（去重）

    // ==================== 翻译功能 ====================

    // 使用 Google Translate 免费接口翻译
    async function translateText(text) {
      if (!text || text.trim() === '') return text;

      // 检查缓存
      if (state.translations[text]) {
        return state.translations[text];
      }

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        const data = await response.json();

        // 解析返回结果
        let translated = '';
        if (data && data[0]) {
          data[0].forEach(item => {
            if (item[0]) translated += item[0];
          });
        }

        // 缓存翻译结果
        if (translated) {
          state.translations[text] = translated;
        }

        return translated || text;
      } catch (error) {
        console.error('翻译失败:', error);
        return text;
      }
    }

    // 批量翻译
    async function translateBatch(texts) {
      const results = {};
      const uniqueTexts = [...new Set(texts.filter(t => t && t.trim()))];

      // 分批翻译，避免请求过多
      const batchSize = 10;
      for (let i = 0; i < uniqueTexts.length; i += batchSize) {
        const batch = uniqueTexts.slice(i, i + batchSize);
        await Promise.all(batch.map(async (text) => {
          results[text] = await translateText(text);
        }));

        // 添加小延迟避免被限流
        if (i + batchSize < uniqueTexts.length) {
          await new Promise(resolve => setTimeout(resolve, 100));
        }
      }

      return results;
    }

    // 一键翻译处理
    async function handleTranslate() {
      const btn = document.getElementById('translateBtn');
      const dataSource = getCurrentData();
      const currentData = dataSource[state.currentMonth] || [];

      if (currentData.length === 0) {
        showToast('没有可翻译的数据');
        return;
      }

      // 如果已翻译，切换回原文
      if (state.isTranslated) {
        state.isTranslated = false;
        btn.innerHTML = '<i class="fas fa-language mr-2"></i><span class="font-medium">一键翻译</span>';
        btn.className = 'inline-flex items-center px-5 py-2.5 bg-green-50 text-green-700 rounded-xl hover:bg-green-100 transition-all hover:scale-105 border border-green-200';
        renderTable();
        showToast('已切换回原文');
        return;
      }

      // 开始翻译
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i><span class="font-medium">翻译中...</span>';
      btn.disabled = true;

      try {
        // 收集所有需要翻译的文本
        const textsToTranslate = [];
        currentData.forEach(item => {
          if (item.description) textsToTranslate.push(item.description);
          if (item.tags && Array.isArray(item.tags)) {
            item.tags.forEach(tag => textsToTranslate.push(tag));
          }
        });

        // 批量翻译
        await translateBatch(textsToTranslate);

        state.isTranslated = true;
        btn.innerHTML = '<i class="fas fa-language mr-2"></i><span class="font-medium">显示原文</span>';
        btn.className = 'inline-flex items-center px-5 py-2.5 bg-green-100 text-green-800 rounded-xl hover:bg-green-200 transition-all hover:scale-105 border border-green-300';

        renderTable();
        showToast('翻译完成');
      } catch (error) {
        showToast('翻译失败，请重试');
        btn.innerHTML = '<i class="fas fa-language mr-2"></i><span class="font-medium">一键翻译</span>';
      } finally {
        btn.disabled = false;
      }
    }
