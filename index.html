<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站榜单 - AI 工具排名</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          maxWidth: {
            '8xl': '1600px'
          }
        }
      }
    }
  </script>
  <style>
    /* 排序箭头样式 */
    .sort-arrows {
      display: inline-flex;
      flex-direction: column;
      margin-left: 4px;
      line-height: 0;
    }
    .sort-arrows i {
      font-size: 14px;
      color: #d1d5db;
      cursor: pointer;
      transition: color 0.15s;
      height: 10px;
      display: flex;
      align-items: center;
    }
    .sort-arrows i:hover {
      color: #2563eb;
    }
    .sort-arrows i.active {
      color: #2563eb;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen">

  <!-- Component: Header -->
  <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-gray-200/50 sticky top-0 z-40">
    <div class="max-w-8xl mx-auto px-6 py-5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/25">
            <i class="fas fa-chart-line text-white text-lg"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent">网站榜单</h1>
            <p class="text-sm text-gray-500">AI 网站流量增长排名</p>
          </div>
        </div>
        <div class="hidden md:flex items-center gap-2 text-sm text-gray-500">
          <i class="fas fa-database"></i>
          <span id="headerStats">数据统计</span>
        </div>
      </div>
    </div>
  </header>
  <!-- /Component: Header -->

  <main class="max-w-8xl mx-auto px-6 py-8">
    <div class="flex flex-col lg:flex-row gap-8">

      <!-- Component: MonthSidebar -->
      <aside class="lg:w-52 flex-shrink-0">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 overflow-hidden lg:sticky lg:top-24">
          <div class="p-4 bg-gradient-to-r from-blue-600 to-indigo-600">
            <div class="flex items-center gap-2 text-white">
              <i class="fas fa-calendar-alt"></i>
              <span class="font-semibold">选择月份</span>
            </div>
          </div>
          <div id="monthList" class="max-h-96 overflow-y-auto">
            <div class="p-6 text-sm text-gray-400 text-center">
              <i class="fas fa-inbox text-3xl mb-3 text-gray-300"></i>
              <p>请上传数据</p>
            </div>
          </div>
        </div>
      </aside>
      <!-- /Component: MonthSidebar -->

      <!-- 右侧主内容区 -->
      <div class="flex-1 min-w-0">

        <!-- Component: ActionBar -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 p-5 mb-6">
          <div class="flex flex-wrap items-center gap-3">
            <label class="inline-flex items-center px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl cursor-pointer hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:scale-105">
              <i class="fas fa-upload mr-2"></i>
              <span class="font-medium">上传文件</span>
              <input type="file" id="uploadInput" accept=".json" class="hidden" onchange="handleUpload(event)">
            </label>
            <button onclick="openPasteModal()" class="inline-flex items-center px-5 py-2.5 bg-blue-50 text-blue-700 rounded-xl hover:bg-blue-100 transition-all hover:scale-105 border border-blue-200">
              <i class="fas fa-paste mr-2"></i>
              <span class="font-medium">粘贴 JSON</span>
            </button>
            <button onclick="handleDownload()" class="inline-flex items-center px-5 py-2.5 bg-gray-50 text-gray-700 rounded-xl hover:bg-gray-100 transition-all hover:scale-105 border border-gray-200">
              <i class="fas fa-download mr-2"></i>
              <span class="font-medium">下载 JSON</span>
            </button>
            <button onclick="handleClearCurrentMonth()" class="inline-flex items-center px-5 py-2.5 bg-red-50 text-red-600 rounded-xl hover:bg-red-100 transition-all hover:scale-105 border border-red-200">
              <i class="fas fa-trash-alt mr-2"></i>
              <span class="font-medium">清空当前月</span>
            </button>
            <div class="w-px h-8 bg-gray-200 mx-1"></div>
            <button onclick="handleTranslate()" id="translateBtn" class="inline-flex items-center px-5 py-2.5 bg-green-50 text-green-700 rounded-xl hover:bg-green-100 transition-all hover:scale-105 border border-green-200">
              <i class="fas fa-language mr-2"></i>
              <span class="font-medium">一键翻译</span>
            </button>
          </div>
        </div>
        <!-- /Component: ActionBar -->

        <!-- Component: SearchAndFilter -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 p-5 mb-6">
          <!-- 搜索栏 -->
          <div class="flex flex-col lg:flex-row lg:items-center gap-4 mb-5">
            <div class="flex-1 relative">
              <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input type="text" id="searchInput" placeholder="搜索网站名称..."
                     oninput="handleSearch()"
                     class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
            </div>
            <button onclick="toggleShowFavoritesOnly()" id="favoritesFilterBtn" class="inline-flex items-center px-4 py-3 text-gray-600 hover:text-pink-600 hover:bg-pink-50 rounded-xl transition-all border border-gray-200">
              <i class="far fa-heart mr-2"></i>
              <span>收藏 (0)</span>
            </button>
            <button onclick="toggleShowNotesOnly()" id="notesFilterBtn" class="inline-flex items-center px-4 py-3 text-gray-600 hover:text-yellow-600 hover:bg-yellow-50 rounded-xl transition-all border border-gray-200">
              <i class="far fa-sticky-note mr-2"></i>
              <span>备注 (0)</span>
            </button>
            <button onclick="toggleFilterPanel()" id="filterToggleBtn" class="inline-flex items-center px-4 py-3 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all border border-gray-200">
              <i class="fas fa-filter mr-2"></i>
              <span>筛选</span>
              <i class="fas fa-chevron-down ml-2 text-xs transition-transform" id="filterChevron"></i>
            </button>
            <button onclick="handleResetAll()" class="inline-flex items-center px-4 py-3 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all">
              <i class="fas fa-rotate-right mr-2"></i>
              <span>重置</span>
            </button>
            <button onclick="toggleTrendView()" id="trendViewBtn" class="inline-flex items-center px-4 py-3 text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all border border-gray-200" title="切换趋势视图">
              <i class="fas fa-chart-area mr-2"></i>
              <span>趋势</span>
            </button>
          </div>

          <!-- 筛选面板（可折叠） -->
          <div id="filterPanel" class="hidden border-t border-gray-100 pt-5">
            <div class="flex flex-wrap items-center gap-x-8 gap-y-4">
              <!-- Monthly Visit 筛选 -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-eye text-blue-500"></i>
                  Monthly Visit
                </label>
                <input type="text" id="visitMin" placeholder="最小值 (如 1M)" oninput="handleFilter()"
                       class="w-36 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <span class="text-gray-300">—</span>
                <input type="text" id="visitMax" placeholder="最大值 (如 1B)" oninput="handleFilter()"
                       class="w-36 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
              </div>
              <!-- Growth 筛选 -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-chart-simple text-green-500"></i>
                  Growth
                </label>
                <input type="text" id="growthMin" placeholder="最小值" oninput="handleFilter()"
                       class="w-28 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <span class="text-gray-300">—</span>
                <input type="text" id="growthMax" placeholder="最大值" oninput="handleFilter()"
                       class="w-28 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
              </div>
              <!-- Growth Rate 筛选 -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-percent text-purple-500"></i>
                  Growth Rate
                </label>
                <input type="text" id="rateMin" placeholder="如 10%" oninput="handleFilter()"
                       class="w-24 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <span class="text-gray-300">—</span>
                <input type="text" id="rateMax" placeholder="如 50%" oninput="handleFilter()"
                       class="w-24 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
              </div>
              <!-- Change 筛选 -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-arrows-up-down text-orange-500"></i>
                  Change
                </label>
                <input type="text" id="changeMin" placeholder="如 -5" oninput="handleFilter()"
                       class="w-20 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <span class="text-gray-300">—</span>
                <input type="text" id="changeMax" placeholder="如 10" oninput="handleFilter()"
                       class="w-20 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer ml-2">
                  <input type="checkbox" id="includeNew" onchange="handleFilter()" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                  <span>包含 NEW</span>
                </label>
              </div>
            </div>
            <!-- 持续增长筛选 -->
            <div class="flex flex-wrap items-center gap-x-8 gap-y-4 mt-4 pt-4 border-t border-gray-100">
              <!-- Growth 增长 (Growth > 0) -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-chart-line text-emerald-500"></i>
                  Growth 增长
                </label>
                <select id="consecutiveGrowth" onchange="handleFilter()"
                        class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all cursor-pointer">
                  <option value="">不限</option>
                  <option value="2">连续 2 个月</option>
                  <option value="3">连续 3 个月</option>
                  <option value="4">连续 4 个月</option>
                </select>
              </div>
              <!-- Change 增长 (Change > 0) -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-ranking-star text-amber-500"></i>
                  Change 增长
                </label>
                <select id="consecutiveChange" onchange="handleFilter()"
                        class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all cursor-pointer">
                  <option value="">不限</option>
                  <option value="2">连续 2 个月</option>
                  <option value="3">连续 3 个月</option>
                  <option value="4">连续 4 个月</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <!-- /Component: SearchAndFilter -->

        <!-- Component: StatsBar -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-5 px-1">
          <div id="statsInfo" class="flex items-center gap-2 text-sm text-gray-500">
            <i class="fas fa-database text-gray-400"></i>
            共 0 条，筛选后 0 条
          </div>
          <div id="pageInfo" class="flex items-center gap-2 mt-2 md:mt-0 text-sm text-gray-500">
            <!-- 分页信息在这里动态渲染 -->
          </div>
        </div>
        <!-- /Component: StatsBar -->

        <!-- Component: DataTable -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead>
                <tr class="bg-gradient-to-r from-gray-50 to-gray-100/50 border-b border-gray-200">
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider w-16">#</th>
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider select-none">
                    <span class="flex items-center gap-2">
                      <i class="fas fa-globe text-cyan-400"></i>
                      WEB
                      <span id="sort-name" class="sort-arrows">
                        <i class="fas fa-caret-up" onclick="handleSort('name', 'asc')"></i>
                        <i class="fas fa-caret-down" onclick="handleSort('name', 'desc')"></i>
                      </span>
                    </span>
                  </th>
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider select-none">
                    <span class="flex items-center gap-2">
                      <i class="fas fa-eye text-blue-400"></i>
                      Monthly Visit
                      <span id="sort-month_visited_count" class="sort-arrows">
                        <i class="fas fa-caret-up" onclick="handleSort('month_visited_count', 'asc')"></i>
                        <i class="fas fa-caret-down" onclick="handleSort('month_visited_count', 'desc')"></i>
                      </span>
                    </span>
                  </th>
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider select-none">
                    <span class="flex items-center gap-2">
                      <i class="fas fa-chart-simple text-green-400"></i>
                      Growth
                      <span id="sort-growth" class="sort-arrows">
                        <i class="fas fa-caret-up" onclick="handleSort('growth', 'asc')"></i>
                        <i class="fas fa-caret-down" onclick="handleSort('growth', 'desc')"></i>
                      </span>
                    </span>
                  </th>
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider select-none">
                    <span class="flex items-center gap-2">
                      <i class="fas fa-percent text-purple-400"></i>
                      Growth Rate
                      <span id="sort-growth_rate" class="sort-arrows">
                        <i class="fas fa-caret-up" onclick="handleSort('growth_rate', 'asc')"></i>
                        <i class="fas fa-caret-down" onclick="handleSort('growth_rate', 'desc')"></i>
                      </span>
                    </span>
                  </th>
                  <th class="px-5 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-20 select-none">
                    <span class="flex items-center justify-center gap-1">
                      <i class="fas fa-arrows-up-down text-orange-400"></i>
                      Change
                      <span id="sort-rank_change" class="sort-arrows">
                        <i class="fas fa-caret-up" onclick="handleSort('rank_change', 'asc')"></i>
                        <i class="fas fa-caret-down" onclick="handleSort('rank_change', 'desc')"></i>
                      </span>
                    </span>
                  </th>
                  <th class="px-5 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-16">
                    <i class="fas fa-sticky-note text-yellow-400"></i>
                  </th>
                  <th class="px-5 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-16">
                    <i class="fas fa-heart text-pink-400"></i>
                  </th>
                </tr>
              </thead>
              <tbody id="tableBody" class="divide-y divide-gray-100">
                <!-- 数据行在这里动态渲染 -->
              </tbody>
            </table>
          </div>

          <!-- 空状态 -->
          <div id="emptyState" class="py-20 text-center">
            <div class="w-20 h-20 bg-gradient-to-br from-gray-100 to-gray-200 rounded-full flex items-center justify-center mx-auto mb-5">
              <i class="fas fa-inbox text-3xl text-gray-400"></i>
            </div>
            <p class="text-gray-500 mb-2">暂无数据</p>
            <p class="text-sm text-gray-400">请上传 JSON 文件或粘贴数据</p>
          </div>
        </div>
        <!-- /Component: DataTable -->

        <!-- Component: Pagination -->
        <div id="pagination" class="flex items-center justify-center gap-2 mt-8">
          <!-- 分页按钮在这里动态渲染 -->
        </div>
        <!-- /Component: Pagination -->

      </div>
    </div>
  </main>

  <!-- Component: PasteModal -->
  <div id="pasteModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 max-h-[85vh] flex flex-col transform scale-95 transition-transform duration-300" id="pasteModalContent">
      <div class="flex items-center justify-between p-5 border-b border-gray-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
            <i class="fas fa-paste text-blue-600"></i>
          </div>
          <h3 class="text-lg font-semibold text-gray-900">粘贴 JSON 数据</h3>
        </div>
        <button onclick="closePasteModal()" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-xl transition">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>
      <div class="p-5 flex-1 overflow-hidden">
        <textarea id="pasteInput" placeholder="在此粘贴 JSON 内容..."
                  class="w-full h-72 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl resize-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none font-mono text-sm transition-all"></textarea>
      </div>
      <div class="flex items-center justify-end gap-3 p-5 border-t border-gray-100 bg-gray-50/50 rounded-b-2xl">
        <button onclick="closePasteModal()" class="px-5 py-2.5 text-gray-600 hover:bg-gray-100 rounded-xl transition font-medium">
          取消
        </button>
        <button onclick="handlePasteSubmit()" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl hover:from-blue-700 hover:to-indigo-700 transition shadow-lg shadow-blue-500/25 font-medium">
          <i class="fas fa-check mr-2"></i>确认导入
        </button>
      </div>
    </div>
  </div>
  <!-- /Component: PasteModal -->

  <!-- Component: NoteModal -->
  <div id="noteModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 transform scale-95 transition-transform duration-300" id="noteModalContent">
      <div class="flex items-center justify-between p-5 border-b border-gray-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-yellow-100 rounded-xl flex items-center justify-center">
            <i class="fas fa-sticky-note text-yellow-600"></i>
          </div>
          <div>
            <h3 class="text-lg font-semibold text-gray-900">备注</h3>
            <p id="noteModalName" class="text-sm text-gray-500"></p>
          </div>
        </div>
        <button onclick="closeNoteModal()" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-xl transition">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>
      <div class="p-5">
        <textarea id="noteInput" placeholder="输入备注内容..."
                  class="w-full h-32 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl resize-none focus:ring-2 focus:ring-yellow-500/20 focus:border-yellow-500 focus:bg-white outline-none text-sm transition-all"></textarea>
      </div>
      <div class="flex items-center justify-between gap-3 p-5 border-t border-gray-100 bg-gray-50/50 rounded-b-2xl">
        <button onclick="deleteNote()" id="deleteNoteBtn" class="px-4 py-2.5 text-red-600 hover:bg-red-50 rounded-xl transition font-medium hidden">
          <i class="fas fa-trash-alt mr-2"></i>删除
        </button>
        <div class="flex items-center gap-3 ml-auto">
          <button onclick="closeNoteModal()" class="px-5 py-2.5 text-gray-600 hover:bg-gray-100 rounded-xl transition font-medium">
            取消
          </button>
          <button onclick="saveNote()" class="px-5 py-2.5 bg-gradient-to-r from-yellow-500 to-orange-500 text-white rounded-xl hover:from-yellow-600 hover:to-orange-600 transition shadow-lg shadow-yellow-500/25 font-medium">
            <i class="fas fa-check mr-2"></i>保存
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- /Component: NoteModal -->

  <!-- Component: MonthSelectModal -->
  <div id="monthSelectModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 transform scale-95 transition-transform duration-300" id="monthSelectModalContent">
      <div class="flex items-center justify-between p-5 border-b border-gray-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
            <i class="fas fa-calendar-alt text-blue-600"></i>
          </div>
          <div>
            <h3 class="text-lg font-semibold text-gray-900">选择月份</h3>
            <p class="text-sm text-gray-500">数据中未检测到日期字段</p>
          </div>
        </div>
        <button onclick="closeMonthSelectModal()" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-xl transition">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>
      <div class="p-5">
        <label class="block text-sm font-medium text-gray-700 mb-3">请选择数据所属月份</label>
        <div class="flex items-center gap-3">
          <div class="flex-1">
            <select id="monthSelectYear" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all appearance-none cursor-pointer text-center font-medium">
              <!-- 年份选项由 JS 动态生成 -->
            </select>
          </div>
          <span class="text-gray-400 font-medium">年</span>
          <div class="flex-1">
            <select id="monthSelectMonth" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all appearance-none cursor-pointer text-center font-medium">
              <option value="01">1</option>
              <option value="02">2</option>
              <option value="03">3</option>
              <option value="04">4</option>
              <option value="05">5</option>
              <option value="06">6</option>
              <option value="07">7</option>
              <option value="08">8</option>
              <option value="09">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
            </select>
          </div>
          <span class="text-gray-400 font-medium">月</span>
        </div>
      </div>
      <div class="flex items-center justify-end gap-3 p-5 border-t border-gray-100 bg-gray-50/50 rounded-b-2xl">
        <button onclick="closeMonthSelectModal()" class="px-5 py-2.5 text-gray-600 hover:bg-gray-100 rounded-xl transition font-medium">
          取消
        </button>
        <button onclick="confirmMonthSelect()" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl hover:from-blue-700 hover:to-indigo-700 transition shadow-lg shadow-blue-500/25 font-medium">
          <i class="fas fa-check mr-2"></i>确认
        </button>
      </div>
    </div>
  </div>
  <!-- /Component: MonthSelectModal -->

  <!-- Component: Toast (放在最后确保在最上层) -->
  <div id="toast" class="fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-[9999] flex items-center gap-3"></div>
  <!-- /Component: Toast -->

  <script>
    // ==================== 状态管理 ====================
    const STORAGE_KEY = 'website_ranking_data';
    const PAGE_SIZE = 300;

    let state = {
      allData: {},
      currentMonth: '',
      filteredData: [],
      currentPage: 1,
      sortField: 'growth',
      sortOrder: 'desc',
      searchKeyword: '',
      filterPanelOpen: false,
      filters: {
        visitMin: null,
        visitMax: null,
        growthMin: null,
        growthMax: null,
        rateMin: null,
        rateMax: null,
        changeMin: null,
        changeMax: null,
        includeNew: false,
        consecutiveChange: null,  // 连续排名上升月数
        consecutiveGrowth: null   // 连续增长月数
      },
      favorites: (() => {
        const stored = localStorage.getItem('favorites');
        if (!stored) return {};
        const parsed = JSON.parse(stored);
        // 兼容旧格式：如果是数组，转换为空对象（旧数据无法确定月份）
        if (Array.isArray(parsed)) {
          localStorage.removeItem('favorites');
          return {};
        }
        return parsed;
      })(),  // 按月份存储收藏 { "2025-11": ["handle1"], ... }
      showFavoritesOnly: false,  // 是否只显示收藏
      showNotesOnly: false,  // 是否只显示有备注的
      translations: {},  // 翻译缓存 { "原文": "译文" }
      isTranslated: false,  // 是否已翻译
      notes: JSON.parse(localStorage.getItem('notes') || '{}'),  // 备注 { "handle": "备注内容" }
      showTrendView: localStorage.getItem('showTrendView') === 'true'  // 是否展开趋势视图
    };

    // ==================== 工具函数 ====================

    // 解析数值输入（支持 100M, 100K, 10% 格式）
    function parseValueInput(value) {
      if (!value || value.trim() === '') return null;

      const str = value.trim().toUpperCase();

      // 处理百分比
      if (str.endsWith('%')) {
        const num = parseFloat(str.slice(0, -1));
        return isNaN(num) ? null : num / 100;
      }

      // 处理 B（十亿）
      if (str.endsWith('B')) {
        const num = parseFloat(str.slice(0, -1));
        return isNaN(num) ? null : num * 1000000000;
      }

      // 处理 M（百万）
      if (str.endsWith('M')) {
        const num = parseFloat(str.slice(0, -1));
        return isNaN(num) ? null : num * 1000000;
      }

      // 处理 K（千）
      if (str.endsWith('K')) {
        const num = parseFloat(str.slice(0, -1));
        return isNaN(num) ? null : num * 1000;
      }

      // 纯数字
      const num = parseFloat(str);
      return isNaN(num) ? null : num;
    }

    // 格式化数值显示
    function formatNumber(num) {
      if (num >= 1000000000) {
        return (num / 1000000000).toFixed(2) + 'B';
      } else if (num >= 1000000) {
        return (num / 1000000).toFixed(2) + 'M';
      } else if (num >= 1000) {
        return (num / 1000).toFixed(2) + 'K';
      }
      return num.toString();
    }

    // 格式化增长率
    function formatRate(rate) {
      const percent = (rate * 100).toFixed(2);
      return rate >= 0 ? `+${percent}%` : `${percent}%`;
    }

    // 格式化增长值
    function formatGrowth(growth) {
      const formatted = formatNumber(Math.abs(growth));
      return growth >= 0 ? `+${formatted}` : `-${formatted}`;
    }

    // 从日期字符串提取月份
    function extractMonth(dateStr) {
      const match = dateStr.match(/^(\d{4}-\d{2})/);
      return match ? match[1] : null;
    }

    // 显示 Toast 消息
    function showToast(message, type = 'success', persistent = false) {
      const toast = document.getElementById('toast');
      const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
      const bgColor = type === 'success' ? 'bg-gradient-to-r from-green-500 to-emerald-500' :
                      type === 'error' ? 'bg-gradient-to-r from-red-500 to-rose-500' :
                      'bg-gradient-to-r from-gray-700 to-gray-800';

      toast.className = `fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-2xl transform transition-all duration-300 z-50 flex items-center gap-3 text-white ${bgColor}`;

      if (persistent) {
        // 需要手动关闭的通知，添加关闭按钮
        toast.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span><button onclick="hideToast()" class="ml-2 hover:bg-white/20 rounded-full w-6 h-6 flex items-center justify-center"><i class="fas fa-times text-sm"></i></button>`;
      } else {
        toast.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
      }

      setTimeout(() => {
        toast.classList.remove('translate-y-20', 'opacity-0');
      }, 10);

      // 非持久通知自动消失
      if (!persistent) {
        setTimeout(() => {
          toast.classList.add('translate-y-20', 'opacity-0');
        }, 3000);
      }
    }

    function hideToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('translate-y-20', 'opacity-0');
    }

    // ==================== UI 交互 ====================

    // 切换筛选面板
    function toggleFilterPanel() {
      state.filterPanelOpen = !state.filterPanelOpen;
      const panel = document.getElementById('filterPanel');
      const chevron = document.getElementById('filterChevron');
      const btn = document.getElementById('filterToggleBtn');

      if (state.filterPanelOpen) {
        panel.classList.remove('hidden');
        chevron.classList.add('rotate-180');
        btn.classList.add('bg-blue-50', 'text-blue-600', 'border-blue-200');
      } else {
        panel.classList.add('hidden');
        chevron.classList.remove('rotate-180');
        btn.classList.remove('bg-blue-50', 'text-blue-600', 'border-blue-200');
      }
    }

    // ==================== 数据操作 ====================

    // 从 LocalStorage 加载数据
    function loadFromStorage() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          state.allData = JSON.parse(stored);

          const months = Object.keys(state.allData).sort().reverse();
          if (months.length > 0) {
            state.currentMonth = months[0];
          }

          updateMonthSelect();
          applyFiltersAndRender();
          updateHeaderStats();
        }
      } catch (e) {
        console.error('加载数据失败:', e);
      }
    }

    // 保存到 LocalStorage
    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.allData));
        // 同时保存到服务器文件
        saveToServer();
      } catch (e) {
        console.error('保存数据失败:', e);
        showToast('保存数据失败，可能存储空间不足', 'error');
      }
    }

    // ==================== 服务器 API ====================

    const API_BASE = 'http://localhost:3000/api';

    // 保存所有数据到服务器
    async function saveToServer() {
      try {
        // 保存主数据
        await fetch(`${API_BASE}/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: 'allData.json', content: state.allData })
        });

        // 保存收藏
        await fetch(`${API_BASE}/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: 'favorites.json', content: state.favorites })
        });

        // 保存备注
        await fetch(`${API_BASE}/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: 'notes.json', content: state.notes })
        });

        console.log('[自动保存] 数据已保存到服务器');
      } catch (e) {
        // 服务器未启动时静默失败，不影响正常使用
        console.log('[自动保存] 服务器未连接，仅保存到 localStorage');
      }
    }

    // 从服务器加载数据（本地开发用）
    async function loadFromServer() {
      try {
        // 加载主数据
        const dataRes = await fetch(`${API_BASE}/load?filename=allData.json`);
        if (dataRes.ok) {
          const dataJson = await dataRes.json();
          if (dataJson.success && dataJson.content) {
            state.allData = dataJson.content;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state.allData));
          }
        }

        // 加载收藏
        const favRes = await fetch(`${API_BASE}/load?filename=favorites.json`);
        if (favRes.ok) {
          const favJson = await favRes.json();
          if (favJson.success && favJson.content) {
            state.favorites = favJson.content;
            localStorage.setItem('favorites', JSON.stringify(state.favorites));
          }
        }

        // 加载备注
        const notesRes = await fetch(`${API_BASE}/load?filename=notes.json`);
        if (notesRes.ok) {
          const notesJson = await notesRes.json();
          if (notesJson.success && notesJson.content) {
            state.notes = notesJson.content;
            localStorage.setItem('notes', JSON.stringify(state.notes));
          }
        }

        console.log('[启动] 从服务器加载数据成功');
        return true;
      } catch (e) {
        console.log('[启动] 服务器未连接，尝试从静态文件加载');
        return false;
      }
    }

    // 从静态 JSON 文件加载数据（GitHub Pages 部署用）
    async function loadFromStaticFiles() {
      try {
        // 加载主数据
        const dataRes = await fetch('./data/allData.json');
        if (dataRes.ok) {
          const data = await dataRes.json();
          state.allData = data;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.allData));
          console.log('[启动] 从静态文件加载主数据成功');
        }

        // 加载收藏
        const favRes = await fetch('./data/favorites.json');
        if (favRes.ok) {
          const favData = await favRes.json();
          state.favorites = favData;
          localStorage.setItem('favorites', JSON.stringify(state.favorites));
        }

        // 加载备注
        const notesRes = await fetch('./data/notes.json');
        if (notesRes.ok) {
          const notesData = await notesRes.json();
          state.notes = notesData;
          localStorage.setItem('notes', JSON.stringify(state.notes));
        }

        return true;
      } catch (e) {
        console.log('[启动] 加载静态文件失败:', e);
        return false;
      }
    }

    // 保存收藏和备注（单独调用）
    function saveFavoritesAndNotes() {
      localStorage.setItem('favorites', JSON.stringify(state.favorites));
      localStorage.setItem('notes', JSON.stringify(state.notes));
      saveToServer();
    }

    // 更新月份列表
    function updateMonthSelect() {
      const monthList = document.getElementById('monthList');
      const months = Object.keys(state.allData).sort().reverse();

      if (months.length === 0) {
        monthList.innerHTML = `
          <div class="p-6 text-sm text-gray-400 text-center">
            <i class="fas fa-inbox text-3xl mb-3 text-gray-300"></i>
            <p>请上传数据</p>
          </div>
        `;
        return;
      }

      monthList.innerHTML = months.map(m => {
        const isActive = m === state.currentMonth;
        const dataCount = state.allData[m]?.length || 0;
        return `
          <button onclick="selectMonth('${m}')"
                  data-month="${m}"
                  class="w-full px-4 py-3 text-left transition-all ${
                    isActive
                      ? 'bg-gradient-to-r from-blue-50 to-indigo-50 text-blue-700 border-l-4 border-blue-600'
                      : 'text-gray-600 hover:bg-gray-50 border-l-4 border-transparent'
                  }">
            <div class="font-medium">${m}</div>
            <div class="text-xs ${isActive ? 'text-blue-500' : 'text-gray-400'} mt-0.5">${dataCount} 条数据</div>
          </button>
        `;
      }).join('');
    }

    // 更新头部统计
    function updateHeaderStats() {
      const months = Object.keys(state.allData).length;
      const total = Object.values(state.allData).reduce((sum, arr) => sum + arr.length, 0);
      document.getElementById('headerStats').textContent = `${months} 个月份 · ${total} 条数据`;
    }

    // 选择月份
    function selectMonth(month) {
      state.currentMonth = month;
      state.currentPage = 1;
      updateMonthSelect();
      applyFiltersAndRender();
      updateFavoritesButton();
      updateNotesButton();
    }

    // ==================== 事件处理 ====================

    // 暂存待处理的 JSON 数据（用于月份选择弹窗）
    let pendingJsonData = null;

    // 打开月份选择弹窗
    function openMonthSelectModal(json) {
      pendingJsonData = json;
      const modal = document.getElementById('monthSelectModal');
      const content = document.getElementById('monthSelectModalContent');
      const yearSelect = document.getElementById('monthSelectYear');
      const monthSelect = document.getElementById('monthSelectMonth');

      // 生成年份选项（从 2020 到当前年份 + 1）
      const currentYear = new Date().getFullYear();
      yearSelect.innerHTML = '';
      for (let y = currentYear + 1; y >= 2020; y--) {
        const option = document.createElement('option');
        option.value = y;
        option.textContent = y;
        yearSelect.appendChild(option);
      }

      // 默认选中：有数据 → 最新月份，无数据 → 当前系统月份
      const months = Object.keys(state.allData).sort();
      let defaultYear, defaultMonth;
      if (months.length > 0) {
        const latest = months[months.length - 1];  // 最新月份，如 "2025-11"
        [defaultYear, defaultMonth] = latest.split('-');
      } else {
        const now = new Date();
        defaultYear = now.getFullYear().toString();
        defaultMonth = String(now.getMonth() + 1).padStart(2, '0');
      }

      yearSelect.value = defaultYear;
      monthSelect.value = defaultMonth;

      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        content.classList.remove('scale-95');
      }, 10);
    }

    // 关闭月份选择弹窗
    function closeMonthSelectModal() {
      const modal = document.getElementById('monthSelectModal');
      const content = document.getElementById('monthSelectModalContent');
      modal.classList.add('opacity-0');
      content.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
      pendingJsonData = null;
    }

    // 确认月份选择
    function confirmMonthSelect() {
      const yearSelect = document.getElementById('monthSelectYear');
      const monthSelect = document.getElementById('monthSelectMonth');
      const year = yearSelect.value;
      const month = monthSelect.value;

      if (!year || !month) {
        showToast('请选择月份', 'error');
        return;
      }

      const fullMonth = `${year}-${month}`;

      if (pendingJsonData) {
        processJsonDataWithMonth(pendingJsonData, fullMonth);
        closeMonthSelectModal();
      }
    }

    // 处理 JSON 数据（共用逻辑）
    function processJsonData(json) {
      if (!json.data || !Array.isArray(json.data)) {
        throw new Error('JSON 格式错误：缺少 data 数组');
      }

      if (json.data.length === 0) {
        throw new Error('数据为空');
      }

      const firstItem = json.data[0];

      // 尝试从 date 字段提取月份（优先使用原始字段）
      let month = null;
      if (firstItem.date) {
        month = extractMonth(firstItem.date);
      }

      // 如果没有月份，弹窗让用户选择
      if (!month) {
        openMonthSelectModal(json);
        return;
      }

      processJsonDataWithMonth(json, month);
    }

    // 使用指定月份处理 JSON 数据
    function processJsonDataWithMonth(json, month) {
      // 规范化数据格式：优先使用原字段，没有再从兼容字段提取
      json.data = json.data.map(item => {
        const normalized = { ...item };

        // 从 traffic 对象提取数据（作为兜底）
        const traffic = item.traffic || {};

        // month_visited_count：顶层优先
        if (normalized.month_visited_count === undefined) {
          const trafficSum = (traffic.monthly_visits_direct || 0) +
                             (traffic.monthly_visits_search || 0) +
                             (traffic.monthly_visits_social || 0) +
                             (traffic.monthly_visits_referrals || 0) +
                             (traffic.monthly_visits_mail || 0);
          normalized.month_visited_count = trafficSum || 0;
        }

        // growth：顶层优先 > traffic.growth
        if (normalized.growth === undefined) {
          normalized.growth = traffic.growth !== undefined ? traffic.growth : 0;
        }

        // growth_rate：顶层优先 > traffic.growth_rate
        if (normalized.growth_rate === undefined) {
          normalized.growth_rate = traffic.growth_rate !== undefined ? traffic.growth_rate : 0;
        }

        // tags：顶层优先 > 从 categories 提取 name
        if (!normalized.tags || normalized.tags.length === 0) {
          if (item.categories && Array.isArray(item.categories)) {
            normalized.tags = item.categories.map(cat => cat.name).slice(0, 6);
          } else {
            normalized.tags = [];
          }
        }

        // description：顶层优先 > what_is_summary
        if (!normalized.description) {
          normalized.description = item.what_is_summary || '';
        }

        return normalized;
      });

      // 合并并去重数据（按 handle 去重，新数据优先）
      const existingData = state.allData[month] || [];
      const existingMap = new Map();

      // 先加入已有数据
      existingData.forEach(item => {
        if (item.handle) {
          existingMap.set(item.handle, item);
        }
      });

      // 新数据覆盖已有数据（按 handle）
      let newCount = 0;
      let updateCount = 0;
      json.data.forEach(item => {
        if (item.handle) {
          if (existingMap.has(item.handle)) {
            updateCount++;
          } else {
            newCount++;
          }
          existingMap.set(item.handle, item);
        }
      });

      // 转换回数组
      state.allData[month] = Array.from(existingMap.values());
      state.currentMonth = month;

      // 处理 favorites 字段（如果存在则合并到该月份）
      if (json.favorites && Array.isArray(json.favorites)) {
        if (!state.favorites[month]) {
          state.favorites[month] = [];
        }
        const existing = state.favorites[month];
        const newFavorites = [...new Set([...existing, ...json.favorites])];
        const addedCount = newFavorites.length - existing.length;
        state.favorites[month] = newFavorites;
        if (addedCount > 0) {
          showToast(`同时导入了 ${addedCount} 个收藏`);
        }
      }

      // 处理 notes 字段（全局合并，新备注覆盖旧备注）
      if (json.notes && typeof json.notes === 'object') {
        let notesAddedCount = 0;
        Object.entries(json.notes).forEach(([handle, note]) => {
          if (note && !state.notes[handle]) {
            notesAddedCount++;
          }
          if (note) {
            state.notes[handle] = note;
          }
        });
        if (notesAddedCount > 0) {
          showToast(`同时导入了 ${notesAddedCount} 个备注`);
        }
      }

      // 保存收藏和备注到服务器
      saveFavoritesAndNotes();

      saveToStorage();
      updateMonthSelect();
      updateHeaderStats();

      resetFiltersAndSort();
      applyFiltersAndRender();
      updateFavoritesButton();
      updateNotesButton();

      // 显示合并结果（需要手动关闭）
      const totalCount = state.allData[month].length;
      if (existingData.length === 0) {
        showToast(`成功导入 ${month} 的 ${json.data.length} 条数据`, 'success', true);
      } else {
        showToast(`${month}: 新增 ${newCount} 条，更新 ${updateCount} 条，共 ${totalCount} 条`, 'success', true);
      }
    }

    // 尝试修复并解析 JSON
    function tryParseJson(text) {
      let content = text.trim();

      // 预处理：替换中文标点符号为英文标点
      content = content
        .replace(/[""]/g, '"')      // 中文引号 → 英文引号
        .replace(/['']/g, "'")      // 中文单引号 → 英文单引号
        .replace(/，/g, ',')        // 中文逗号 → 英文逗号
        .replace(/：/g, ':')        // 中文冒号 → 英文冒号
        .replace(/；/g, ';')        // 中文分号 → 英文分号
        .replace(/【/g, '[')        // 中文方括号
        .replace(/】/g, ']')
        .replace(/（/g, '(')        // 中文圆括号
        .replace(/）/g, ')');

      // 预处理：移除末尾多余的逗号（如 ], 或 }, 或单独的 ,）
      content = content
        .replace(/,\s*$/g, '')      // 移除末尾的逗号
        .replace(/,\s*}/g, '}')     // 移除 } 前的逗号
        .replace(/,\s*]/g, ']');    // 移除 ] 前的逗号

      // 1. 直接尝试解析
      try {
        return JSON.parse(content);
      } catch (e) {
        // 继续尝试修复
      }

      // 2. 如果以 "data": 开头，补充外层大括号
      if (content.startsWith('"data"')) {
        try {
          return JSON.parse('{' + content + '}');
        } catch (e) {
          // 继续尝试
        }
      }

      // 3. 如果以 [ 开头，可能是纯数组，包装成 { data: [...] }
      if (content.startsWith('[')) {
        try {
          const arr = JSON.parse(content);
          if (Array.isArray(arr)) {
            return { data: arr };
          }
        } catch (e) {
          // 继续尝试
        }
      }

      // 4. 如果以 "data": 开头，尝试各种修复组合
      if (content.startsWith('"data"')) {
        // 可能末尾缺少 } 或有其他问题
        let fixed = '{' + content;
        if (!fixed.endsWith('}')) {
          fixed = fixed + '}';
        }
        try {
          return JSON.parse(fixed);
        } catch (e) {
          // 继续尝试
        }
      }

      // 5. 兜底方案：用正则提取关键字段
      const extractedData = extractDataFromText(content);
      if (extractedData.length > 0) {
        return { data: extractedData };
      }

      // 所有修复尝试失败，抛出原始错误
      throw new Error('JSON 格式无法解析，请检查格式是否正确');
    }

    // 从文本中提取关键字段（兜底方案）
    function extractDataFromText(text) {
      const items = [];

      // 提取字符串值的辅助函数
      const extractString = (text, key) => {
        // 匹配 "key": "value" 或 "key": 'value'
        const regex = new RegExp(`"${key}"\\s*:\\s*"([^"]*)"`, 'i');
        const match = text.match(regex);
        return match ? match[1] : null;
      };

      // 提取数字值的辅助函数
      const extractNumber = (text, key) => {
        const regex = new RegExp(`"${key}"\\s*:\\s*(-?[\\d.]+)`, 'i');
        const match = text.match(regex);
        return match ? parseFloat(match[1]) : null;
      };

      // 提取数组值的辅助函数（简单字符串数组）
      const extractStringArray = (text, key) => {
        const regex = new RegExp(`"${key}"\\s*:\\s*\\[([^\\]]*?)\\]`, 'i');
        const match = text.match(regex);
        if (!match) return [];
        // 提取数组中的字符串
        const arrayContent = match[1];
        const strRegex = /"([^"]*)"/g;
        const result = [];
        let strMatch;
        while ((strMatch = strRegex.exec(arrayContent)) !== null) {
          result.push(strMatch[1]);
        }
        return result;
      };

      // 使用平衡括号匹配提取每个对象
      // 查找所有包含 "handle": 的对象块
      let depth = 0;
      let start = -1;
      let inString = false;
      let prevChar = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];

        // 处理字符串内部
        if (char === '"' && prevChar !== '\\') {
          inString = !inString;
        }

        if (!inString) {
          if (char === '{') {
            if (depth === 0) {
              start = i;
            }
            depth++;
          } else if (char === '}') {
            depth--;
            if (depth === 0 && start !== -1) {
              // 找到一个完整的对象
              const objText = text.substring(start, i + 1);

              // 检查是否包含关键字段 handle
              if (objText.includes('"handle"')) {
                const handle = extractString(objText, 'handle');
                const name = extractString(objText, 'name');

                // 必须有 handle 和 name
                if (handle && name) {
                  const item = {
                    handle,
                    name,
                    description: extractString(objText, 'description') || extractString(objText, 'what_is_summary') || '',
                    month_visited_count: extractNumber(objText, 'month_visited_count') || 0,
                    growth: extractNumber(objText, 'growth') || 0,
                    growth_rate: extractNumber(objText, 'growth_rate') || 0,
                    tags: extractStringArray(objText, 'tags'),
                    date: extractString(objText, 'date') || ''  // 只匹配 date 字段，没有则让用户选择
                  };

                  // 如果 tags 为空，尝试从 categories 提取
                  if (item.tags.length === 0) {
                    // 简单提取 categories 中的 name
                    const catRegex = /"categories"\s*:\s*\[([\s\S]*?)\]/;
                    const catMatch = objText.match(catRegex);
                    if (catMatch) {
                      const catNameRegex = /"name"\s*:\s*"([^"]*)"/g;
                      let catNameMatch;
                      while ((catNameMatch = catNameRegex.exec(catMatch[1])) !== null) {
                        // 排除 "Features", "Pricing" 等非分类名
                        if (!['Features', 'Pricing', 'Website', 'Free', 'Freemium'].includes(catNameMatch[1])) {
                          item.tags.push(catNameMatch[1]);
                        }
                      }
                      item.tags = item.tags.slice(0, 6);
                    }
                  }

                  // 尝试从 traffic 对象提取 growth 和 growth_rate
                  if (item.growth === 0 || item.growth_rate === 0) {
                    const trafficRegex = /"traffic"\s*:\s*\{([\s\S]*?)\}/;
                    const trafficMatch = objText.match(trafficRegex);
                    if (trafficMatch) {
                      const trafficText = trafficMatch[1];
                      if (item.growth === 0) {
                        const tGrowth = extractNumber(trafficText, 'growth');
                        if (tGrowth !== null) item.growth = tGrowth;
                      }
                      if (item.growth_rate === 0) {
                        const tRate = extractNumber(trafficText, 'growth_rate');
                        if (tRate !== null) item.growth_rate = tRate;
                      }
                    }
                  }

                  items.push(item);
                }
              }
              start = -1;
            }
          }
        }
        prevChar = char;
      }

      return items;
    }

      // 删除当前月份数据

      // 迁移当前月份的收藏到其他月份
      const favoritesToMigrate = state.favorites[monthToDelete] || [];
      delete state.favorites[monthToDelete];

      if (favoritesToMigrate.length > 0) {
        // 找到其他存在的月份（优先最近的）
        const otherMonths = Object.keys(state.allData).sort().reverse();
        if (otherMonths.length > 0) {
          const targetMonth = otherMonths[0];
          if (!state.favorites[targetMonth]) {
            state.favorites[targetMonth] = [];
          }
          // 合并收藏（去重）
          const merged = [...new Set([...state.favorites[targetMonth], ...favoritesToMigrate])];
          state.favorites[targetMonth] = merged;
        }
        // 如果没有其他月份，收藏会丢失
      }

      saveFavoritesAndNotes();

    // ==================== 翻译功能 ====================

    // 使用 Google Translate 免费接口翻译
    async function translateText(text) {
      if (!text || text.trim() === '') return text;

      // 检查缓存
      if (state.translations[text]) {
        return state.translations[text];
      }

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        const data = await response.json();

        // 解析返回结果
        let translated = '';
        if (data && data[0]) {
          data[0].forEach(item => {
            if (item[0]) translated += item[0];
          });
        }

        // 缓存翻译结果
        if (translated) {
          state.translations[text] = translated;
        }

        return translated || text;
      } catch (error) {
        console.error('翻译失败:', error);
        return text;
      }
    }

    // 批量翻译
    async function translateBatch(texts) {
      const results = {};
      const uniqueTexts = [...new Set(texts.filter(t => t && t.trim()))];

      // 分批翻译，避免请求过多
      const batchSize = 10;
      for (let i = 0; i < uniqueTexts.length; i += batchSize) {
        const batch = uniqueTexts.slice(i, i + batchSize);
        await Promise.all(batch.map(async (text) => {
          results[text] = await translateText(text);
        }));

        // 添加小延迟避免被限流
        if (i + batchSize < uniqueTexts.length) {
          await new Promise(resolve => setTimeout(resolve, 100));
        }
      }

      return results;
    }

    // 一键翻译处理
    async function handleTranslate() {
      const btn = document.getElementById('translateBtn');
      const currentData = state.allData[state.currentMonth] || [];

      if (currentData.length === 0) {
        showToast('没有可翻译的数据');
        return;
      }

      // 如果已翻译，切换回原文
      if (state.isTranslated) {
        state.isTranslated = false;
        btn.innerHTML = '<i class="fas fa-language mr-2"></i><span class="font-medium">一键翻译</span>';
        btn.className = 'inline-flex items-center px-5 py-2.5 bg-green-50 text-green-700 rounded-xl hover:bg-green-100 transition-all hover:scale-105 border border-green-200';
        renderTable();
        showToast('已切换回原文');
        return;
      }

      // 开始翻译
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i><span class="font-medium">翻译中...</span>';
      btn.disabled = true;

      try {
        // 收集所有需要翻译的文本
        const textsToTranslate = [];
        currentData.forEach(item => {
          if (item.description) textsToTranslate.push(item.description);
          if (item.tags && Array.isArray(item.tags)) {
            item.tags.forEach(tag => textsToTranslate.push(tag));
          }
        });

        // 批量翻译
        await translateBatch(textsToTranslate);

        state.isTranslated = true;
        btn.innerHTML = '<i class="fas fa-language mr-2"></i><span class="font-medium">显示原文</span>';
        btn.className = 'inline-flex items-center px-5 py-2.5 bg-green-100 text-green-800 rounded-xl hover:bg-green-200 transition-all hover:scale-105 border border-green-300';

        renderTable();
        showToast('翻译完成');
      } catch (error) {
        showToast('翻译失败，请重试');
        btn.innerHTML = '<i class="fas fa-language mr-2"></i><span class="font-medium">一键翻译</span>';
      } finally {
        btn.disabled = false;
      }
    }
