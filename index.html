<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站榜单 - AI 工具排名</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          maxWidth: {
            '8xl': '1440px'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen">

  <!-- Component: Header -->
  <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-gray-200/50 sticky top-0 z-40">
    <div class="max-w-8xl mx-auto px-6 py-5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/25">
            <i class="fas fa-chart-line text-white text-lg"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent">网站榜单</h1>
            <p class="text-sm text-gray-500">AI 工具网站月度访问量排名</p>
          </div>
        </div>
        <div class="hidden md:flex items-center gap-2 text-sm text-gray-500">
          <i class="fas fa-database"></i>
          <span id="headerStats">数据统计</span>
        </div>
      </div>
    </div>
  </header>
  <!-- /Component: Header -->

  <main class="max-w-8xl mx-auto px-6 py-8">
    <div class="flex flex-col lg:flex-row gap-8">

      <!-- Component: MonthSidebar -->
      <aside class="lg:w-52 flex-shrink-0">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 overflow-hidden lg:sticky lg:top-24">
          <div class="p-4 bg-gradient-to-r from-blue-600 to-indigo-600">
            <div class="flex items-center gap-2 text-white">
              <i class="fas fa-calendar-alt"></i>
              <span class="font-semibold">选择月份</span>
            </div>
          </div>
          <div id="monthList" class="max-h-96 overflow-y-auto">
            <div class="p-6 text-sm text-gray-400 text-center">
              <i class="fas fa-inbox text-3xl mb-3 text-gray-300"></i>
              <p>请上传数据</p>
            </div>
          </div>
        </div>
      </aside>
      <!-- /Component: MonthSidebar -->

      <!-- 右侧主内容区 -->
      <div class="flex-1 min-w-0">

        <!-- Component: ActionBar -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 p-5 mb-6">
          <div class="flex flex-wrap items-center gap-3">
            <label class="inline-flex items-center px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl cursor-pointer hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:scale-105">
              <i class="fas fa-upload mr-2"></i>
              <span class="font-medium">上传文件</span>
              <input type="file" id="uploadInput" accept=".json" class="hidden" onchange="handleUpload(event)">
            </label>
            <button onclick="openPasteModal()" class="inline-flex items-center px-5 py-2.5 bg-blue-50 text-blue-700 rounded-xl hover:bg-blue-100 transition-all hover:scale-105 border border-blue-200">
              <i class="fas fa-paste mr-2"></i>
              <span class="font-medium">粘贴 JSON</span>
            </button>
            <button onclick="handleDownload()" class="inline-flex items-center px-5 py-2.5 bg-gray-50 text-gray-700 rounded-xl hover:bg-gray-100 transition-all hover:scale-105 border border-gray-200">
              <i class="fas fa-download mr-2"></i>
              <span class="font-medium">下载 JSON</span>
            </button>
          </div>
        </div>
        <!-- /Component: ActionBar -->

        <!-- Component: SearchAndFilter -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 p-5 mb-6">
          <!-- 搜索栏 -->
          <div class="flex flex-col lg:flex-row lg:items-center gap-4 mb-5">
            <div class="flex-1 relative">
              <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input type="text" id="searchInput" placeholder="搜索网站名称..."
                     oninput="handleSearch()"
                     class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
            </div>
            <button onclick="toggleFilterPanel()" id="filterToggleBtn" class="inline-flex items-center px-4 py-3 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all border border-gray-200">
              <i class="fas fa-filter mr-2"></i>
              <span>筛选</span>
              <i class="fas fa-chevron-down ml-2 text-xs transition-transform" id="filterChevron"></i>
            </button>
            <button onclick="handleResetAll()" class="inline-flex items-center px-4 py-3 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all">
              <i class="fas fa-rotate-right mr-2"></i>
              <span>重置</span>
            </button>
          </div>

          <!-- 筛选面板（可折叠） -->
          <div id="filterPanel" class="hidden border-t border-gray-100 pt-5">
            <div class="flex flex-wrap items-center gap-x-8 gap-y-4">
              <!-- Monthly Visit 筛选 -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-eye text-blue-500"></i>
                  Monthly Visit
                </label>
                <input type="text" id="visitMin" placeholder="最小值 (如 1M)" oninput="handleFilter()"
                       class="w-36 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <span class="text-gray-300">—</span>
                <input type="text" id="visitMax" placeholder="最大值 (如 1B)" oninput="handleFilter()"
                       class="w-36 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
              </div>
              <!-- Growth 筛选 -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-chart-simple text-green-500"></i>
                  Growth
                </label>
                <input type="text" id="growthMin" placeholder="最小值" oninput="handleFilter()"
                       class="w-28 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <span class="text-gray-300">—</span>
                <input type="text" id="growthMax" placeholder="最大值" oninput="handleFilter()"
                       class="w-28 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
              </div>
              <!-- Growth Rate 筛选 -->
              <div class="flex items-center gap-3">
                <label class="flex items-center gap-2 text-sm font-medium text-gray-600 whitespace-nowrap">
                  <i class="fas fa-percent text-purple-500"></i>
                  Growth Rate
                </label>
                <input type="text" id="rateMin" placeholder="如 10%" oninput="handleFilter()"
                       class="w-24 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
                <span class="text-gray-300">—</span>
                <input type="text" id="rateMax" placeholder="如 50%" oninput="handleFilter()"
                       class="w-24 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all">
              </div>
            </div>
          </div>
        </div>
        <!-- /Component: SearchAndFilter -->

        <!-- Component: StatsBar -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-5 px-1">
          <div id="statsInfo" class="flex items-center gap-2 text-sm text-gray-500">
            <i class="fas fa-database text-gray-400"></i>
            共 0 条，筛选后 0 条
          </div>
          <div id="pageInfo" class="flex items-center gap-2 mt-2 md:mt-0 text-sm text-gray-500">
            <!-- 分页信息在这里动态渲染 -->
          </div>
        </div>
        <!-- /Component: StatsBar -->

        <!-- Component: DataTable -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead>
                <tr class="bg-gradient-to-r from-gray-50 to-gray-100/50 border-b border-gray-200">
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider w-16">#</th>
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">网站</th>
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 transition select-none group" onclick="handleSort('month_visited_count')">
                    <span class="flex items-center gap-2">
                      <i class="fas fa-eye text-blue-400"></i>
                      Monthly Visit
                      <span id="sort-month_visited_count" class="text-gray-300 group-hover:text-gray-500"><i class="fas fa-sort"></i></span>
                    </span>
                  </th>
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 transition select-none group" onclick="handleSort('growth')">
                    <span class="flex items-center gap-2">
                      <i class="fas fa-chart-simple text-green-400"></i>
                      Growth
                      <span id="sort-growth" class="text-gray-300 group-hover:text-gray-500"><i class="fas fa-sort"></i></span>
                    </span>
                  </th>
                  <th class="px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 transition select-none group" onclick="handleSort('growth_rate')">
                    <span class="flex items-center gap-2">
                      <i class="fas fa-percent text-purple-400"></i>
                      Growth Rate
                      <span id="sort-growth_rate" class="text-gray-300 group-hover:text-gray-500"><i class="fas fa-sort"></i></span>
                    </span>
                  </th>
                </tr>
              </thead>
              <tbody id="tableBody" class="divide-y divide-gray-100">
                <!-- 数据行在这里动态渲染 -->
              </tbody>
            </table>
          </div>

          <!-- 空状态 -->
          <div id="emptyState" class="py-20 text-center">
            <div class="w-20 h-20 bg-gradient-to-br from-gray-100 to-gray-200 rounded-full flex items-center justify-center mx-auto mb-5">
              <i class="fas fa-inbox text-3xl text-gray-400"></i>
            </div>
            <p class="text-gray-500 mb-2">暂无数据</p>
            <p class="text-sm text-gray-400">请上传 JSON 文件或粘贴数据</p>
          </div>
        </div>
        <!-- /Component: DataTable -->

        <!-- Component: Pagination -->
        <div id="pagination" class="flex items-center justify-center gap-2 mt-8">
          <!-- 分页按钮在这里动态渲染 -->
        </div>
        <!-- /Component: Pagination -->

      </div>
    </div>
  </main>

  <!-- Component: PasteModal -->
  <div id="pasteModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 max-h-[85vh] flex flex-col transform scale-95 transition-transform duration-300" id="pasteModalContent">
      <div class="flex items-center justify-between p-5 border-b border-gray-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
            <i class="fas fa-paste text-blue-600"></i>
          </div>
          <h3 class="text-lg font-semibold text-gray-900">粘贴 JSON 数据</h3>
        </div>
        <button onclick="closePasteModal()" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-xl transition">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>
      <div class="p-5 flex-1 overflow-hidden">
        <textarea id="pasteInput" placeholder="在此粘贴 JSON 内容..."
                  class="w-full h-72 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl resize-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none font-mono text-sm transition-all"></textarea>
      </div>
      <div class="flex items-center justify-end gap-3 p-5 border-t border-gray-100 bg-gray-50/50 rounded-b-2xl">
        <button onclick="closePasteModal()" class="px-5 py-2.5 text-gray-600 hover:bg-gray-100 rounded-xl transition font-medium">
          取消
        </button>
        <button onclick="handlePasteSubmit()" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl hover:from-blue-700 hover:to-indigo-700 transition shadow-lg shadow-blue-500/25 font-medium">
          <i class="fas fa-check mr-2"></i>确认导入
        </button>
      </div>
    </div>
  </div>
  <!-- /Component: PasteModal -->

  <!-- Component: Toast (放在最后确保在最上层) -->
  <div id="toast" class="fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-[9999] flex items-center gap-3"></div>
  <!-- /Component: Toast -->

  <script>
    // ==================== 状态管理 ====================
    const STORAGE_KEY = 'website_ranking_data';
    const PAGE_SIZE = 300;

    let state = {
      allData: {},
      currentMonth: '',
      filteredData: [],
      currentPage: 1,
      sortField: null,
      sortOrder: null,
      searchKeyword: '',
      filterPanelOpen: false,
      filters: {
        visitMin: null,
        visitMax: null,
        growthMin: null,
        growthMax: null,
        rateMin: null,
        rateMax: null
      }
    };

    // ==================== 工具函数 ====================

    // 解析数值输入（支持 100M, 100K, 10% 格式）
    function parseValueInput(value) {
      if (!value || value.trim() === '') return null;

      const str = value.trim().toUpperCase();

      // 处理百分比
      if (str.endsWith('%')) {
        const num = parseFloat(str.slice(0, -1));
        return isNaN(num) ? null : num / 100;
      }

      // 处理 B（十亿）
      if (str.endsWith('B')) {
        const num = parseFloat(str.slice(0, -1));
        return isNaN(num) ? null : num * 1000000000;
      }

      // 处理 M（百万）
      if (str.endsWith('M')) {
        const num = parseFloat(str.slice(0, -1));
        return isNaN(num) ? null : num * 1000000;
      }

      // 处理 K（千）
      if (str.endsWith('K')) {
        const num = parseFloat(str.slice(0, -1));
        return isNaN(num) ? null : num * 1000;
      }

      // 纯数字
      const num = parseFloat(str);
      return isNaN(num) ? null : num;
    }

    // 格式化数值显示
    function formatNumber(num) {
      if (num >= 1000000000) {
        return (num / 1000000000).toFixed(2) + 'B';
      } else if (num >= 1000000) {
        return (num / 1000000).toFixed(2) + 'M';
      } else if (num >= 1000) {
        return (num / 1000).toFixed(2) + 'K';
      }
      return num.toString();
    }

    // 格式化增长率
    function formatRate(rate) {
      const percent = (rate * 100).toFixed(2);
      return rate >= 0 ? `+${percent}%` : `${percent}%`;
    }

    // 格式化增长值
    function formatGrowth(growth) {
      const formatted = formatNumber(Math.abs(growth));
      return growth >= 0 ? `+${formatted}` : `-${formatted}`;
    }

    // 从日期字符串提取月份
    function extractMonth(dateStr) {
      const match = dateStr.match(/^(\d{4}-\d{2})/);
      return match ? match[1] : null;
    }

    // 显示 Toast 消息
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
      const bgColor = type === 'success' ? 'bg-gradient-to-r from-green-500 to-emerald-500' :
                      type === 'error' ? 'bg-gradient-to-r from-red-500 to-rose-500' :
                      'bg-gradient-to-r from-gray-700 to-gray-800';

      toast.className = `fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-2xl transform transition-all duration-300 z-50 flex items-center gap-3 text-white ${bgColor}`;
      toast.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;

      setTimeout(() => {
        toast.classList.remove('translate-y-20', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // ==================== UI 交互 ====================

    // 切换筛选面板
    function toggleFilterPanel() {
      state.filterPanelOpen = !state.filterPanelOpen;
      const panel = document.getElementById('filterPanel');
      const chevron = document.getElementById('filterChevron');
      const btn = document.getElementById('filterToggleBtn');

      if (state.filterPanelOpen) {
        panel.classList.remove('hidden');
        chevron.classList.add('rotate-180');
        btn.classList.add('bg-blue-50', 'text-blue-600', 'border-blue-200');
      } else {
        panel.classList.add('hidden');
        chevron.classList.remove('rotate-180');
        btn.classList.remove('bg-blue-50', 'text-blue-600', 'border-blue-200');
      }
    }

    // ==================== 数据操作 ====================

    // 从 LocalStorage 加载数据
    function loadFromStorage() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          state.allData = JSON.parse(stored);

          const months = Object.keys(state.allData).sort().reverse();
          if (months.length > 0) {
            state.currentMonth = months[0];
          }

          updateMonthSelect();
          applyFiltersAndRender();
          updateHeaderStats();
        }
      } catch (e) {
        console.error('加载数据失败:', e);
      }
    }

    // 保存到 LocalStorage
    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.allData));
      } catch (e) {
        console.error('保存数据失败:', e);
        showToast('保存数据失败，可能存储空间不足', 'error');
      }
    }

    // 更新月份列表
    function updateMonthSelect() {
      const monthList = document.getElementById('monthList');
      const months = Object.keys(state.allData).sort().reverse();

      if (months.length === 0) {
        monthList.innerHTML = `
          <div class="p-6 text-sm text-gray-400 text-center">
            <i class="fas fa-inbox text-3xl mb-3 text-gray-300"></i>
            <p>请上传数据</p>
          </div>
        `;
        return;
      }

      monthList.innerHTML = months.map(m => {
        const isActive = m === state.currentMonth;
        const dataCount = state.allData[m]?.length || 0;
        return `
          <button onclick="selectMonth('${m}')"
                  data-month="${m}"
                  class="w-full px-4 py-3 text-left transition-all ${
                    isActive
                      ? 'bg-gradient-to-r from-blue-50 to-indigo-50 text-blue-700 border-l-4 border-blue-600'
                      : 'text-gray-600 hover:bg-gray-50 border-l-4 border-transparent'
                  }">
            <div class="font-medium">${m}</div>
            <div class="text-xs ${isActive ? 'text-blue-500' : 'text-gray-400'} mt-0.5">${dataCount} 条数据</div>
          </button>
        `;
      }).join('');
    }

    // 更新头部统计
    function updateHeaderStats() {
      const months = Object.keys(state.allData).length;
      const total = Object.values(state.allData).reduce((sum, arr) => sum + arr.length, 0);
      document.getElementById('headerStats').textContent = `${months} 个月份 · ${total} 条数据`;
    }

    // 选择月份
    function selectMonth(month) {
      state.currentMonth = month;
      state.currentPage = 1;
      updateMonthSelect();
      applyFiltersAndRender();
    }

    // ==================== 事件处理 ====================

    // 处理 JSON 数据（共用逻辑）
    function processJsonData(json) {
      if (!json.data || !Array.isArray(json.data)) {
        throw new Error('JSON 格式错误：缺少 data 数组');
      }

      if (json.data.length === 0) {
        throw new Error('数据为空');
      }

      const firstItem = json.data[0];
      if (!firstItem.date) {
        throw new Error('数据缺少 date 字段');
      }

      const month = extractMonth(firstItem.date);
      if (!month) {
        throw new Error('无法解析月份');
      }

      state.allData[month] = json.data;
      state.currentMonth = month;

      saveToStorage();
      updateMonthSelect();
      updateHeaderStats();

      resetFiltersAndSort();
      applyFiltersAndRender();

      showToast(`成功导入 ${month} 的 ${json.data.length} 条数据`);
    }

    // 尝试修复并解析 JSON
    function tryParseJson(text) {
      let content = text.trim();

      // 预处理：替换中文标点符号为英文标点
      content = content
        .replace(/[""]/g, '"')      // 中文引号 → 英文引号
        .replace(/['']/g, "'")      // 中文单引号 → 英文单引号
        .replace(/，/g, ',')        // 中文逗号 → 英文逗号
        .replace(/：/g, ':')        // 中文冒号 → 英文冒号
        .replace(/；/g, ';')        // 中文分号 → 英文分号
        .replace(/【/g, '[')        // 中文方括号
        .replace(/】/g, ']')
        .replace(/（/g, '(')        // 中文圆括号
        .replace(/）/g, ')');

      // 预处理：移除末尾多余的逗号（如 ], 或 }, 或单独的 ,）
      content = content
        .replace(/,\s*$/g, '')      // 移除末尾的逗号
        .replace(/,\s*}/g, '}')     // 移除 } 前的逗号
        .replace(/,\s*]/g, ']');    // 移除 ] 前的逗号

      // 1. 直接尝试解析
      try {
        return JSON.parse(content);
      } catch (e) {
        // 继续尝试修复
      }

      // 2. 如果以 "data": 开头，补充外层大括号
      if (content.startsWith('"data"')) {
        try {
          return JSON.parse('{' + content + '}');
        } catch (e) {
          // 继续尝试
        }
      }

      // 3. 如果以 [ 开头，可能是纯数组，包装成 { data: [...] }
      if (content.startsWith('[')) {
        try {
          const arr = JSON.parse(content);
          if (Array.isArray(arr)) {
            return { data: arr };
          }
        } catch (e) {
          // 继续尝试
        }
      }

      // 4. 如果以 "data": 开头，尝试各种修复组合
      if (content.startsWith('"data"')) {
        // 可能末尾缺少 } 或有其他问题
        let fixed = '{' + content;
        if (!fixed.endsWith('}')) {
          fixed = fixed + '}';
        }
        try {
          return JSON.parse(fixed);
        } catch (e) {
          // 继续尝试
        }
      }

      // 所有修复尝试失败，抛出原始错误
      throw new Error('JSON 格式无法解析，请检查格式是否正确');
    }

    // 上传 JSON 文件
    function handleUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const json = tryParseJson(e.target.result);
          processJsonData(json);
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      reader.readAsText(file);
      event.target.value = '';
    }

    // 打开粘贴弹窗
    function openPasteModal() {
      const modal = document.getElementById('pasteModal');
      const content = document.getElementById('pasteModalContent');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        content.classList.remove('scale-95');
      }, 10);
      document.getElementById('pasteInput').value = '';
      document.getElementById('pasteInput').focus();
    }

    // 关闭粘贴弹窗
    function closePasteModal() {
      const modal = document.getElementById('pasteModal');
      const content = document.getElementById('pasteModalContent');
      modal.classList.add('opacity-0');
      content.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }

    // 处理粘贴提交
    function handlePasteSubmit() {
      const content = document.getElementById('pasteInput').value.trim();

      if (!content) {
        showToast('请输入 JSON 内容', 'error');
        return;
      }

      try {
        const json = tryParseJson(content);
        processJsonData(json);
        closePasteModal();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // 下载 JSON 文件
    function handleDownload() {
      if (!state.currentMonth || !state.allData[state.currentMonth]) {
        showToast('没有可下载的数据', 'error');
        return;
      }

      const data = { data: state.allData[state.currentMonth] };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `website-ranking-${state.currentMonth}.json`;
      a.click();

      URL.revokeObjectURL(url);
      showToast('下载成功');
    }

    // 搜索
    function handleSearch() {
      state.searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
      state.currentPage = 1;
      applyFiltersAndRender();
    }

    // 筛选
    function handleFilter() {
      state.filters = {
        visitMin: parseValueInput(document.getElementById('visitMin').value),
        visitMax: parseValueInput(document.getElementById('visitMax').value),
        growthMin: parseValueInput(document.getElementById('growthMin').value),
        growthMax: parseValueInput(document.getElementById('growthMax').value),
        rateMin: parseValueInput(document.getElementById('rateMin').value),
        rateMax: parseValueInput(document.getElementById('rateMax').value)
      };
      state.currentPage = 1;
      applyFiltersAndRender();
    }

    // 排序
    function handleSort(field) {
      if (state.sortField === field) {
        if (state.sortOrder === 'asc') {
          state.sortOrder = 'desc';
        } else if (state.sortOrder === 'desc') {
          state.sortField = null;
          state.sortOrder = null;
        } else {
          state.sortOrder = 'asc';
        }
      } else {
        state.sortField = field;
        state.sortOrder = 'asc';
      }

      applyFiltersAndRender();
      updateSortIcons();
    }

    // 更新排序图标
    function updateSortIcons() {
      const fields = ['month_visited_count', 'growth', 'growth_rate'];

      fields.forEach(field => {
        const icon = document.getElementById(`sort-${field}`);
        if (state.sortField === field) {
          if (state.sortOrder === 'asc') {
            icon.innerHTML = '<i class="fas fa-sort-up text-blue-600"></i>';
          } else {
            icon.innerHTML = '<i class="fas fa-sort-down text-blue-600"></i>';
          }
        } else {
          icon.innerHTML = '<i class="fas fa-sort"></i>';
        }
      });
    }

    // 切换页码
    function handlePageChange(page) {
      const totalPages = Math.ceil(state.filteredData.length / PAGE_SIZE);
      if (page < 1 || page > totalPages) return;

      state.currentPage = page;
      renderTable();
      renderPagination();

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 重置全部
    function handleResetAll() {
      document.getElementById('searchInput').value = '';
      document.getElementById('visitMin').value = '';
      document.getElementById('visitMax').value = '';
      document.getElementById('growthMin').value = '';
      document.getElementById('growthMax').value = '';
      document.getElementById('rateMin').value = '';
      document.getElementById('rateMax').value = '';

      resetFiltersAndSort();
      applyFiltersAndRender();
      showToast('已重置全部筛选条件');
    }

    // 重置筛选和排序状态
    function resetFiltersAndSort() {
      state.searchKeyword = '';
      state.sortField = null;
      state.sortOrder = null;
      state.currentPage = 1;
      state.filters = {
        visitMin: null,
        visitMax: null,
        growthMin: null,
        growthMax: null,
        rateMin: null,
        rateMax: null
      };
      updateSortIcons();
    }

    // ==================== 数据处理和渲染 ====================

    // 应用筛选和排序
    function applyFiltersAndRender() {
      const sourceData = state.allData[state.currentMonth] || [];

      // 1. 搜索过滤
      let filtered = sourceData.filter(item => {
        if (state.searchKeyword) {
          return item.name.toLowerCase().includes(state.searchKeyword);
        }
        return true;
      });

      // 2. 范围筛选
      filtered = filtered.filter(item => {
        const { visitMin, visitMax, growthMin, growthMax, rateMin, rateMax } = state.filters;

        if (visitMin !== null && item.month_visited_count < visitMin) return false;
        if (visitMax !== null && item.month_visited_count > visitMax) return false;
        if (growthMin !== null && item.growth < growthMin) return false;
        if (growthMax !== null && item.growth > growthMax) return false;
        if (rateMin !== null && item.growth_rate < rateMin) return false;
        if (rateMax !== null && item.growth_rate > rateMax) return false;

        return true;
      });

      // 3. 排序
      if (state.sortField && state.sortOrder) {
        filtered.sort((a, b) => {
          const aVal = a[state.sortField];
          const bVal = b[state.sortField];

          if (state.sortOrder === 'asc') {
            return aVal - bVal;
          } else {
            return bVal - aVal;
          }
        });
      }

      state.filteredData = filtered;

      // 更新统计信息
      const total = sourceData.length;
      const filteredCount = filtered.length;
      document.getElementById('statsInfo').innerHTML = `
        <i class="fas fa-database text-gray-400"></i>
        共 <span class="font-semibold text-gray-700">${total}</span> 条，筛选后 <span class="font-semibold text-blue-600">${filteredCount}</span> 条
      `;

      renderTable();
      renderPagination();
    }

    // 渲染表格
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const emptyState = document.getElementById('emptyState');

      const start = (state.currentPage - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const pageData = state.filteredData.slice(start, end);

      if (pageData.length === 0) {
        tbody.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      tbody.innerHTML = pageData.map((item, index) => {
        const rank = start + index + 1;
        const tags = (item.tags || []).slice(0, 4);

        // 排名徽章样式
        let rankBadge = '';
        if (rank === 1) {
          rankBadge = '<div class="w-8 h-8 bg-gradient-to-br from-yellow-400 to-amber-500 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-yellow-500/30">1</div>';
        } else if (rank === 2) {
          rankBadge = '<div class="w-8 h-8 bg-gradient-to-br from-gray-300 to-gray-400 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-gray-400/30">2</div>';
        } else if (rank === 3) {
          rankBadge = '<div class="w-8 h-8 bg-gradient-to-br from-amber-600 to-amber-700 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-amber-600/30">3</div>';
        } else {
          rankBadge = `<div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 font-semibold text-sm">${rank}</div>`;
        }

        return `
          <!-- Component: TableRow -->
          <tr data-list-item class="hover:bg-gradient-to-r hover:from-blue-50/50 hover:to-indigo-50/50 transition-all group">
            <td class="px-5 py-4">${rankBadge}</td>
            <td class="px-5 py-4">
              <div class="flex flex-col">
                <span data-field="item.name" class="font-semibold text-gray-900 group-hover:text-blue-600 transition-colors">${escapeHtml(item.name)}</span>
                <span data-field="item.description" class="text-sm text-gray-500 mt-1 line-clamp-2">${escapeHtml(item.description || '')}</span>
                ${tags.length > 0 ? `
                  <div class="flex flex-wrap gap-1.5 mt-2">
                    ${tags.map(tag => `
                      <span class="inline-block px-2.5 py-1 text-xs bg-gradient-to-r from-gray-100 to-gray-50 text-gray-600 rounded-full border border-gray-200/50">${escapeHtml(tag)}</span>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            </td>
            <td class="px-5 py-4">
              <span data-field="item.month_visited_count" class="inline-flex items-center px-3 py-1.5 bg-blue-50 text-blue-700 rounded-lg font-semibold text-sm">
                ${formatNumber(item.month_visited_count)}
              </span>
            </td>
            <td class="px-5 py-4">
              <span data-field="item.growth" class="inline-flex items-center px-3 py-1.5 ${item.growth >= 0 ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'} rounded-lg font-semibold text-sm">
                <i class="fas ${item.growth >= 0 ? 'fa-arrow-up' : 'fa-arrow-down'} mr-1.5 text-xs"></i>
                ${formatGrowth(item.growth)}
              </span>
            </td>
            <td class="px-5 py-4">
              <span data-field="item.growth_rate" class="inline-flex items-center px-3 py-1.5 ${item.growth_rate >= 0 ? 'bg-purple-50 text-purple-700' : 'bg-red-50 text-red-700'} rounded-lg font-semibold text-sm">
                ${formatRate(item.growth_rate)}
              </span>
            </td>
          </tr>
          <!-- /Component: TableRow -->
        `;
      }).join('');
    }

    // 渲染分页
    function renderPagination() {
      const pagination = document.getElementById('pagination');
      const totalPages = Math.ceil(state.filteredData.length / PAGE_SIZE);

      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }

      let html = '';

      // 上一页按钮
      html += `
        <button onclick="handlePageChange(${state.currentPage - 1})"
                class="w-10 h-10 rounded-xl flex items-center justify-center ${state.currentPage === 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-100 hover:text-blue-600'} transition"
                ${state.currentPage === 1 ? 'disabled' : ''}>
          <i class="fas fa-chevron-left"></i>
        </button>
      `;

      // 页码按钮
      const maxButtons = 5;
      let startPage = Math.max(1, state.currentPage - Math.floor(maxButtons / 2));
      let endPage = Math.min(totalPages, startPage + maxButtons - 1);

      if (endPage - startPage < maxButtons - 1) {
        startPage = Math.max(1, endPage - maxButtons + 1);
      }

      if (startPage > 1) {
        html += `<button onclick="handlePageChange(1)" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-600 hover:bg-gray-100 transition">1</button>`;
        if (startPage > 2) {
          html += `<span class="px-2 text-gray-400">...</span>`;
        }
      }

      for (let i = startPage; i <= endPage; i++) {
        html += `
          <button onclick="handlePageChange(${i})"
                  class="w-10 h-10 rounded-xl flex items-center justify-center transition font-medium ${i === state.currentPage ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-500/25' : 'text-gray-600 hover:bg-gray-100'}">
            ${i}
          </button>
        `;
      }

      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          html += `<span class="px-2 text-gray-400">...</span>`;
        }
        html += `<button onclick="handlePageChange(${totalPages})" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-600 hover:bg-gray-100 transition">${totalPages}</button>`;
      }

      // 下一页按钮
      html += `
        <button onclick="handlePageChange(${state.currentPage + 1})"
                class="w-10 h-10 rounded-xl flex items-center justify-center ${state.currentPage === totalPages ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-100 hover:text-blue-600'} transition"
                ${state.currentPage === totalPages ? 'disabled' : ''}>
          <i class="fas fa-chevron-right"></i>
        </button>
      `;

      pagination.innerHTML = html;
    }

    // HTML 转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ==================== 初始化 ====================
    document.addEventListener('DOMContentLoaded', function() {
      loadFromStorage();
    });

    // ESC 关闭弹窗
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closePasteModal();
      }
    });
  </script>

</body>
</html>
