    // ==================== 趋势功能 ====================

    // 获取网站最近 N 个月的历史数据
    function getHistoryData(handle, maxMonths = 4) {
      const months = Object.keys(state.allData).sort().reverse();  // 最新的在前
      const history = [];

      for (let i = 0; i < Math.min(months.length, maxMonths); i++) {
        const month = months[i];
        const data = state.allData[month] || [];
        const item = data.find(d => d.handle === handle);

        if (item) {
          // 计算该月的 Change（排名变化）
          const rankChangeMap = getRankChangeMapForMonth(month);
          const change = rankChangeMap[handle] || { type: 'new', value: 0 };
          let changeValue = 0;
          if (change.type === 'up') changeValue = change.value;
          else if (change.type === 'down') changeValue = -change.value;
          else if (change.type === 'new') changeValue = null;

          history.push({
            month,
            monthLabel: month.split('-')[1],  // 只取月份数字
            growth: item.growth || 0,
            change: changeValue
          });
        }
      }

      return history.reverse();  // 返回时间正序（旧的在前）
    }

    // 获取指定月份的排名变化 Map
    function getRankChangeMapForMonth(targetMonth) {
      const months = Object.keys(state.allData).sort();
      const currentIndex = months.indexOf(targetMonth);
      const previousMonth = currentIndex > 0 ? months[currentIndex - 1] : null;

      const currentData = state.allData[targetMonth] || [];
      const currentRanks = {};
      [...currentData].sort((a, b) => b.growth - a.growth).forEach((item, index) => {
        currentRanks[item.handle] = index + 1;
      });

      if (!previousMonth || !state.allData[previousMonth]) {
        const result = {};
        currentData.forEach(item => {
          result[item.handle] = { type: 'new' };
        });
        return result;
      }

      const previousData = state.allData[previousMonth];
      const previousRanks = {};
      [...previousData].sort((a, b) => b.growth - a.growth).forEach((item, index) => {
        previousRanks[item.handle] = index + 1;
      });

      const result = {};
      currentData.forEach(item => {
        const currentRank = currentRanks[item.handle];
        const previousRank = previousRanks[item.handle];

        if (!previousRank) {
          result[item.handle] = { type: 'new' };
        } else if (previousRank > currentRank) {
          result[item.handle] = { type: 'up', value: previousRank - currentRank };
        } else if (previousRank < currentRank) {
          result[item.handle] = { type: 'down', value: currentRank - previousRank };
        } else {
          result[item.handle] = { type: 'same', value: 0 };
        }
      });

      return result;
    }

    // 检查连续排名上升（Change > 0）
    function checkConsecutiveChange(handle, months) {
      const history = getHistoryData(handle, parseInt(months));

      // 数据不足，返回 false
      if (history.length < parseInt(months)) return false;

      // 检查所有月份的 change 是否都 > 0（排名上升）
      return history.every(h => h.change !== null && h.change > 0);
    }

    // 检查连续增长（Growth > 0）
    function checkConsecutiveGrowth(handle, months) {
      const history = getHistoryData(handle, parseInt(months));

      // 数据不足，返回 false
      if (history.length < parseInt(months)) return false;

      // 检查所有月份的 growth 是否都 > 0
      return history.every(h => h.growth > 0);
    }

    // 生成迷你折线图 SVG
    function generateSparklineSVG(data, color, width = 80, height = 30) {
      if (!data || data.length === 0) return '';

      const values = data.map(d => d.value);
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = max - min || 1;

      const padding = 4;
      const chartWidth = width - padding * 2;
      const chartHeight = height - padding * 2;

      const points = values.map((v, i) => {
        const x = padding + (i / (values.length - 1 || 1)) * chartWidth;
        const y = padding + chartHeight - ((v - min) / range) * chartHeight;
        return `${x},${y}`;
      }).join(' ');

      // 绘制圆点
      const dots = values.map((v, i) => {
        const x = padding + (i / (values.length - 1 || 1)) * chartWidth;
        const y = padding + chartHeight - ((v - min) / range) * chartHeight;
        return `<circle cx="${x}" cy="${y}" r="2.5" fill="${color}" />`;
      }).join('');

      return `
        <svg width="${width}" height="${height}" class="inline-block">
          <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          ${dots}
        </svg>
      `;
    }

    // 生成趋势提示框 HTML
    function generateTrendTooltip(handle) {
      const history = getHistoryData(handle, 4);

      if (history.length === 0) {
        return '<div class="text-gray-400 text-xs">暂无历史数据</div>';
      }

      // Growth 数据
      const growthData = history.map(h => ({ label: h.monthLabel, value: h.growth }));
      const growthSVG = generateSparklineSVG(growthData, '#10b981', 90, 35);

      // Change 数据（排除 null）
      const changeData = history.filter(h => h.change !== null).map(h => ({ label: h.monthLabel, value: h.change }));
      const changeSVG = changeData.length > 0 ? generateSparklineSVG(changeData, '#3b82f6', 90, 35) : '<div class="text-gray-400 text-xs h-[35px] flex items-center">数据不足</div>';

      // 格式化数值显示
      const formatGrowthValue = (v) => {
        if (Math.abs(v) >= 1000000) return (v / 1000000).toFixed(1) + 'M';
        if (Math.abs(v) >= 1000) return (v / 1000).toFixed(0) + 'K';
        return v.toString();
      };

      const growthLabels = history.map(h => `<span class="text-[10px] ${h.growth >= 0 ? 'text-green-600' : 'text-red-500'}">${formatGrowthValue(h.growth)}</span>`).join('');
      const changeLabels = history.map(h => {
        if (h.change === null) return '<span class="text-[10px] text-blue-500">NEW</span>';
        return `<span class="text-[10px] ${h.change >= 0 ? 'text-green-600' : 'text-red-500'}">${h.change >= 0 ? '+' : ''}${h.change}</span>`;
      }).join('');
      const monthLabels = history.map(h => `<span class="text-[10px] text-gray-400">${h.monthLabel}月</span>`).join('');

      return `
        <div class="flex gap-4">
          <div class="flex flex-col items-center">
            <div class="text-[10px] text-gray-500 mb-1 font-medium">Growth</div>
            ${growthSVG}
            <div class="flex justify-between w-full mt-1 gap-1">${growthLabels}</div>
          </div>
          <div class="flex flex-col items-center">
            <div class="text-[10px] text-gray-500 mb-1 font-medium">Change</div>
            ${changeSVG}
            <div class="flex justify-between w-full mt-1 gap-1">${changeLabels}</div>
          </div>
        </div>
        <div class="flex justify-around mt-2 border-t border-gray-100 pt-1">${monthLabels}</div>
      `;
    }

    // 生成展开行的大折线图 SVG（带坐标轴）
    function generateLargeSparklineSVG(data, color, title, formatFn, width = 200, height = 80) {
      if (!data || data.length === 0) {
        return `
          <div class="flex flex-col items-center justify-center" style="width: ${width}px; height: ${height + 30}px;">
            <div class="text-xs font-medium text-gray-500 mb-2">${title}</div>
            <div class="text-gray-400 text-xs">暂无数据</div>
          </div>
        `;
      }

      const values = data.map(d => d.value);
      const labels = data.map(d => d.label);
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = max - min || 1;

      // 增加顶部 padding 以容纳数值标签
      const padding = { top: 20, right: 16, bottom: 22, left: 16 };
      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom;

      // 生成折线路径
      const points = values.map((v, i) => {
        const x = padding.left + (i / (values.length - 1 || 1)) * chartWidth;
        const y = padding.top + chartHeight - ((v - min) / range) * chartHeight;
        return `${x},${y}`;
      }).join(' ');

      // 生成圆点和数值标签
      const dotsAndLabels = values.map((v, i) => {
        const x = padding.left + (i / (values.length - 1 || 1)) * chartWidth;
        const y = padding.top + chartHeight - ((v - min) / range) * chartHeight;
        const labelColor = v >= 0 ? '#059669' : '#dc2626';
        return `
          <circle cx="${x}" cy="${y}" r="3" fill="${color}" />
          <text x="${x}" y="${y - 10}" text-anchor="middle" fill="${labelColor}" font-size="10" font-weight="500">${formatFn(v)}</text>
        `;
      }).join('');

      // 生成 X 轴月份标签
      const xLabels = labels.map((label, i) => {
        const x = padding.left + (i / (labels.length - 1 || 1)) * chartWidth;
        return `<text x="${x}" y="${height - 6}" text-anchor="middle" fill="#9ca3af" font-size="10">${label}月</text>`;
      }).join('');

      return `
        <div class="flex flex-col items-center">
          <div class="text-xs font-medium text-gray-500 mb-1">${title}</div>
          <svg width="${width}" height="${height}" class="inline-block overflow-visible">
            <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            ${dotsAndLabels}
            ${xLabels}
          </svg>
        </div>
      `;
    }

    // 生成趋势展开行的 HTML
    function generateTrendRow(handle, colSpan) {
      const history = getHistoryData(handle, 4);

      if (history.length === 0) {
        return `
          <tr class="bg-gradient-to-r from-gray-50/50 to-indigo-50/30">
            <td colspan="${colSpan}" class="px-5 py-3">
              <div class="flex items-center justify-center text-gray-400 text-sm">
                <i class="fas fa-chart-line mr-2"></i>
                暂无历史趋势数据
              </div>
            </td>
          </tr>
        `;
      }

      // Growth 数据
      const growthData = history.map(h => ({ label: h.monthLabel, value: h.growth }));
      const formatGrowthValue = (v) => {
        if (Math.abs(v) >= 1000000) return (v / 1000000).toFixed(1) + 'M';
        if (Math.abs(v) >= 1000) return (v / 1000).toFixed(0) + 'K';
        return v.toString();
      };
      const growthSVG = generateLargeSparklineSVG(growthData, '#10b981', 'Growth 趋势', formatGrowthValue, 220, 85);

      // Change 数据
      const changeData = history.filter(h => h.change !== null).map(h => ({ label: h.monthLabel, value: h.change }));
      const formatChangeValue = (v) => (v >= 0 ? '+' : '') + v;
      const changeSVG = changeData.length > 0
        ? generateLargeSparklineSVG(changeData, '#3b82f6', 'Change 趋势', formatChangeValue, 220, 85)
        : `<div class="flex flex-col items-center justify-center" style="width: 220px; height: 115px;">
            <div class="text-xs font-medium text-gray-500 mb-2">Change 趋势</div>
            <div class="text-gray-400 text-xs">数据不足</div>
          </div>`;

      return `
        <tr class="bg-gradient-to-r from-gray-50/50 to-indigo-50/30 border-b border-gray-100">
          <td colspan="${colSpan}" class="px-5 py-3">
            <div class="flex items-center justify-start gap-8 pl-8">
              ${growthSVG}
              ${changeSVG}
            </div>
          </td>
        </tr>
      `;
    }

    // ==================== 收藏功能 ====================

    // 获取当前月份的收藏列表（仅当前月份存储的）
    function getCurrentMonthFavorites() {
      if (!state.currentMonth) return [];
      return state.favorites[state.currentMonth] || [];
    }

    // 获取所有收藏的 handle（跨月份合并，用于显示）
    function getAllFavorites() {
      const all = new Set();
      Object.values(state.favorites).forEach(list => {
        if (Array.isArray(list)) {
          list.forEach(handle => all.add(handle));
        }
      });
      return [...all];
    }

    // 获取当前月份显示的收藏（继承所有月份）
    function getDisplayFavorites() {
      return getAllFavorites();
    }

    // 切换备注展开/收起状态
    function toggleNoteExpand(handle) {
      const textEl = document.querySelector(`[data-note-text="${handle}"]`);
      const toggleBtn = document.querySelector(`[data-note-toggle="${handle}"]`);
      if (!textEl || !toggleBtn) return;

      const isExpanded = textEl.classList.contains('note-expanded');
      if (isExpanded) {
        textEl.classList.remove('note-expanded');
        textEl.classList.add('note-clamp');
        toggleBtn.textContent = '展开全部';
      } else {
        textEl.classList.remove('note-clamp');
        textEl.classList.add('note-expanded');
        toggleBtn.textContent = '收起';
      }
    }

    // 检测备注是否溢出，显示展开按钮
    function checkNoteOverflow() {
      document.querySelectorAll('[data-note-text]').forEach(el => {
        const handle = el.getAttribute('data-note-text');
        const toggleBtn = document.querySelector(`[data-note-toggle="${handle}"]`);
        if (!toggleBtn) return;

        // 检测是否被截断（scrollHeight > clientHeight）
        if (el.scrollHeight > el.clientHeight + 2) {
          toggleBtn.classList.remove('hidden');
        } else {
          toggleBtn.classList.add('hidden');
        }
      });
    }

    // 切换收藏状态（存储到当前月份）
    function toggleFavorite(handle) {
      if (!state.currentMonth) return;

      // 检查是否在任意月份已收藏
      const isCurrentlyFavorite = isFavorite(handle);

      if (isCurrentlyFavorite) {
        // 取消收藏：从所有月份中移除
        Object.keys(state.favorites).forEach(month => {
          const list = state.favorites[month];
          if (Array.isArray(list)) {
            const index = list.indexOf(handle);
            if (index !== -1) {
              list.splice(index, 1);
            }
          }
        });
      } else {
        // 添加收藏：存储到当前月份
        if (!state.favorites[state.currentMonth]) {
          state.favorites[state.currentMonth] = [];
        }
        state.favorites[state.currentMonth].push(handle);
      }

      saveFavoritesAndNotes();
      // 只更新按钮样式，避免重新渲染整个表格（防止翻译重置）
      updateFavoriteButtonStyle(handle);
      updateFavoritesButton();
    }

    // 更新单个收藏按钮的样式
    function updateFavoriteButtonStyle(handle) {
      const btn = document.querySelector(`[data-favorite-btn="${handle}"]`);
      if (!btn) return;

      const isFav = isFavorite(handle);
      const icon = btn.querySelector('i');

      if (isFav) {
        btn.className = 'w-8 h-8 flex items-center justify-center rounded-full transition-all text-pink-500 bg-pink-50 hover:bg-pink-100';
        if (icon) icon.className = 'fas fa-heart';
      } else {
        btn.className = 'w-8 h-8 flex items-center justify-center rounded-full transition-all text-gray-300 hover:text-pink-400 hover:bg-pink-50';
        if (icon) icon.className = 'far fa-heart';
      }
      // 保留 data 属性
      btn.setAttribute('data-favorite-btn', handle);
    }

    // 更新单个备注按钮的样式（避免重新渲染整个表格）
    function updateNoteCellStyle(handle) {
      const cell = document.querySelector(`[data-note-cell="${handle}"]`);
      if (!cell) return;

      const itemName = cell.getAttribute('data-item-name') || '';
      const note = state.notes[handle];

      cell.innerHTML = `
        <button onclick="openNoteModal('${escapeHtml(handle)}', '${escapeHtml(itemName)}')"
                class="w-8 h-8 flex items-center justify-center rounded-full transition-all relative group/note ${note ? 'text-yellow-500 bg-yellow-50 hover:bg-yellow-100' : 'text-gray-300 hover:text-yellow-400 hover:bg-yellow-50'}"
                title="${note ? escapeHtml(note) : '添加备注'}">
          <i class="${note ? 'fas' : 'far'} fa-sticky-note"></i>
          ${note ? `
            <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-3 py-2 bg-gray-800 text-white text-xs rounded-lg whitespace-pre-wrap max-w-xs opacity-0 group-hover/note:opacity-100 transition-opacity pointer-events-none z-50">
              ${escapeHtml(note)}
            </div>
          ` : ''}
        </button>
      `;
    }

    // 检查是否已收藏（跨月份检查）
    function isFavorite(handle) {
      return getAllFavorites().includes(handle);
    }

    // 切换只看收藏
    function toggleShowFavoritesOnly() {
      state.showFavoritesOnly = !state.showFavoritesOnly;
      state.currentPage = 1;
      applyFiltersAndRender();
      updateFavoritesButton();
    }

    // 切换只显示有备注的
    function toggleShowNotesOnly() {
      state.showNotesOnly = !state.showNotesOnly;
      state.currentPage = 1;
      applyFiltersAndRender();
      updateNotesButton();
    }

    // 切换趋势视图
    async function toggleTrendView() {
      state.showTrendView = !state.showTrendView;
      // 保存设置到服务器
      try {
        await fetch(`${API_BASE}/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: 'settings.json', content: { showTrendView: state.showTrendView } })
        });
      } catch (e) {
        console.log('[保存] 服务器未连接');
      }
      updateTrendViewButton();
      renderTable();
    }

    // 更新趋势视图按钮状态
    function updateTrendViewButton() {
      const btn = document.getElementById('trendViewBtn');
      if (!btn) return;

      if (state.showTrendView) {
        btn.className = 'inline-flex items-center px-4 py-3 text-indigo-600 bg-indigo-50 rounded-xl transition-all border border-indigo-200';
        btn.title = '收起趋势视图';
      } else {
        btn.className = 'inline-flex items-center px-4 py-3 text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all border border-gray-200';
        btn.title = '展开趋势视图';
      }
    }

    // 获取当前页面可见的备注数
    function getVisibleNotesCount() {
      const currentData = getCurrentData();
      const sourceData = currentData[state.currentMonth] || [];
      return sourceData.filter(item => state.notes[item.handle]).length;
    }

    // 更新备注按钮状态
    function updateNotesButton() {
      const btn = document.getElementById('notesFilterBtn');
      if (!btn) return;
      const count = getVisibleNotesCount();
      if (state.showNotesOnly) {
        btn.className = 'inline-flex items-center px-4 py-3 bg-yellow-100 text-yellow-700 rounded-xl transition-all border border-yellow-300';
        btn.innerHTML = `<i class="fas fa-sticky-note mr-2"></i><span>备注 (${count})</span>`;
      } else {
        btn.className = 'inline-flex items-center px-4 py-3 text-gray-600 hover:text-yellow-600 hover:bg-yellow-50 rounded-xl transition-all border border-gray-200';
        btn.innerHTML = `<i class="far fa-sticky-note mr-2"></i><span>备注 (${count})</span>`;
      }
    }

    // 获取当前页面可见的收藏数（当前月份数据中有多少个被收藏）
    function getVisibleFavoritesCount() {
      const currentData = getCurrentData();
      const sourceData = currentData[state.currentMonth] || [];
      const allFavs = getAllFavorites();
      return sourceData.filter(item => allFavs.includes(item.handle)).length;
    }

    // 获取上一个月份
    function getPreviousMonth(currentMonth) {
      const currentData = getCurrentData();
      const months = Object.keys(currentData).sort();
      const currentIndex = months.indexOf(currentMonth);
      if (currentIndex <= 0) return null;
      return months[currentIndex - 1];
    }

    // 计算排名变化（基于 growth 降序排名）
    function getRankChangeMap() {
      const currentMonth = state.currentMonth;
      const previousMonth = getPreviousMonth(currentMonth);

      // 当前月份按 growth 降序排名
      const currentData = state.allData[currentMonth] || [];
      const currentRanks = {};
      [...currentData].sort((a, b) => b.growth - a.growth).forEach((item, index) => {
        currentRanks[item.handle] = index + 1;
      });

      // 无上月数据，全部返回 NEW
      if (!previousMonth || !state.allData[previousMonth]) {
        const result = {};
        currentData.forEach(item => {
          result[item.handle] = { type: 'new' };
        });
        return result;
      }

      // 上月按 growth 降序排名
      const previousData = state.allData[previousMonth];
      const previousRanks = {};
      [...previousData].sort((a, b) => b.growth - a.growth).forEach((item, index) => {
        previousRanks[item.handle] = index + 1;
      });

      // 计算变化
      const result = {};
      currentData.forEach(item => {
        const currentRank = currentRanks[item.handle];
        const previousRank = previousRanks[item.handle];

        if (previousRank === undefined) {
          // 新上榜
          result[item.handle] = { type: 'new' };
        } else {
          const change = previousRank - currentRank; // 正数表示上升
          if (change > 0) {
            result[item.handle] = { type: 'up', value: change };
          } else if (change < 0) {
            result[item.handle] = { type: 'down', value: Math.abs(change) };
          } else {
            result[item.handle] = { type: 'same' };
          }
        }
      });

      return result;
    }

    // 更新收藏按钮状态
    function updateFavoritesButton() {
      const btn = document.getElementById('favoritesFilterBtn');
      if (!btn) return;
      const count = getVisibleFavoritesCount();
      if (state.showFavoritesOnly) {
        btn.className = 'inline-flex items-center px-4 py-3 bg-pink-100 text-pink-700 rounded-xl transition-all border border-pink-300';
        btn.innerHTML = `<i class="fas fa-heart mr-2"></i><span>收藏 (${count})</span>`;
      } else {
        btn.className = 'inline-flex items-center px-4 py-3 text-gray-600 hover:text-pink-600 hover:bg-pink-50 rounded-xl transition-all border border-gray-200';
        btn.innerHTML = `<i class="far fa-heart mr-2"></i><span>收藏 (${count})</span>`;
      }
    }

    // ==================== 数据处理和渲染 ====================

    // 应用筛选和排序
    function applyFiltersAndRender() {
      const currentData = getCurrentData();
      const sourceData = currentData[state.currentMonth] || [];

      // 1. 搜索过滤
      let filtered = sourceData.filter(item => {
        if (state.searchKeyword) {
          const name = item.website_name || item.name || '';
          return name.toLowerCase().includes(state.searchKeyword);
        }
        return true;
      });

      // 2. 收藏筛选
      if (state.showFavoritesOnly) {
        filtered = filtered.filter(item => isFavorite(item.handle));
      }

      // 2.5 备注筛选
      if (state.showNotesOnly) {
        filtered = filtered.filter(item => state.notes[item.handle]);
      }

      // 3. 范围筛选
      filtered = filtered.filter(item => {
        const { rankMin, rankMax, visitMin, visitMax, growthMin, growthMax, rateMin, rateMax } = state.filters;

        // 排名筛选
        if (rankMin !== null && item.rank < rankMin) return false;
        if (rankMax !== null && item.rank > rankMax) return false;

        if (visitMin !== null && item.month_visited_count < visitMin) return false;
        if (visitMax !== null && item.month_visited_count > visitMax) return false;
        if (growthMin !== null && item.growth < growthMin) return false;
        if (growthMax !== null && item.growth > growthMax) return false;
        if (rateMin !== null && item.growth_rate < rateMin) return false;
        if (rateMax !== null && item.growth_rate > rateMax) return false;

        return true;
      });

      // 4. Change 筛选
      const { changeMin, changeMax, includeNew } = state.filters;
      if (changeMin !== null || changeMax !== null || includeNew) {
        const rankChangeMap = getRankChangeMap();
        filtered = filtered.filter(item => {
          const change = rankChangeMap[item.handle] || { type: 'new' };

          // 如果是 NEW
          if (change.type === 'new') {
            return includeNew;
          }

          // 计算变化值
          let changeValue = 0;
          if (change.type === 'up') changeValue = change.value;
          if (change.type === 'down') changeValue = -change.value;

          // 如果没有设置范围，但勾选了 includeNew，则只显示 NEW
          if (changeMin === null && changeMax === null && includeNew) {
            return false; // 非 NEW 的不显示
          }

          // 范围检查
          if (changeMin !== null && changeValue < changeMin) return false;
          if (changeMax !== null && changeValue > changeMax) return false;

          return true;
        });
      }

      // 5. 持续增长筛选
      const { consecutiveChange, consecutiveGrowth } = state.filters;

      if (consecutiveChange) {
        filtered = filtered.filter(item => {
          return checkConsecutiveChange(item.handle, consecutiveChange);
        });
      }

      if (consecutiveGrowth) {
        filtered = filtered.filter(item => {
          return checkConsecutiveGrowth(item.handle, consecutiveGrowth);
        });
      }

      // 6. 排序
      if (state.sortField && state.sortOrder) {
        // 如果是按 rank_change 排序，需要特殊处理
        if (state.sortField === 'rank_change') {
          const rankChangeMap = getRankChangeMap();

          // CHANGE 排序时排除 NEW（新上榜的网站）
          filtered = filtered.filter(item => {
            const change = rankChangeMap[item.handle] || { type: 'new' };
            return change.type !== 'new';
          });

          filtered.sort((a, b) => {
            const aChange = rankChangeMap[a.handle] || { type: 'new' };
            const bChange = rankChangeMap[b.handle] || { type: 'new' };

            // 计算排序值：up = 正数，same = 0，down = 负数
            const getChangeValue = (change) => {
              if (change.type === 'up') return change.value;
              if (change.type === 'down') return -change.value;
              return 0; // same
            };

            const aVal = getChangeValue(aChange);
            const bVal = getChangeValue(bChange);

            if (state.sortOrder === 'asc') {
              return aVal - bVal;
            } else {
              return bVal - aVal;
            }
          });
        } else if (state.sortField === 'name') {
          // 按名称首字母排序
          filtered.sort((a, b) => {
            const aVal = (a.website_name || a.name || '').toLowerCase();
            const bVal = (b.website_name || b.name || '').toLowerCase();

            if (state.sortOrder === 'asc') {
              return aVal.localeCompare(bVal);
            } else {
              return bVal.localeCompare(aVal);
            }
          });
        } else {
          filtered.sort((a, b) => {
            const aVal = a[state.sortField];
            const bVal = b[state.sortField];

            if (state.sortOrder === 'asc') {
              return aVal - bVal;
            } else {
              return bVal - aVal;
            }
          });
        }
      }

      state.filteredData = filtered;

      // 更新统计信息
      const total = sourceData.length;
      const filteredCount = filtered.length;
      document.getElementById('statsInfo').innerHTML = `
        <i class="fas fa-database text-gray-400"></i>
        共 <span class="font-semibold text-gray-700">${total}</span> 条，筛选后 <span class="font-semibold text-blue-600">${filteredCount}</span> 条
      `;

      renderTable();
      renderPagination();
    }

    // 渲染表格
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const emptyState = document.getElementById('emptyState');

      const start = (state.currentPage - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const pageData = state.filteredData.slice(start, end);

      if (pageData.length === 0) {
        tbody.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      // 获取排名变化数据
      const rankChangeMap = getRankChangeMap();
      const isRevenue = state.currentRankingType === 'revenue';

      // 计算排名 Map
      // 收入榜使用数据中的 rank 字段（基于 JSON 顺序），总榜使用 Growth 排名
      const rankMap = {};
      const currentDataSource = getCurrentData();
      const allMonthData = currentDataSource[state.currentMonth] || [];

      if (isRevenue) {
        // 收入榜：直接使用数据中的 rank 字段
        allMonthData.forEach(item => {
          rankMap[item.handle] = item.rank;
        });
      } else {
        // 总榜：按 growth 降序计算排名
        [...allMonthData].sort((a, b) => b.growth - a.growth).forEach((item, index) => {
          rankMap[item.handle] = index + 1;
        });
      }

      tbody.innerHTML = pageData.map((item, index) => {
        // 收入榜使用原始 rank，总榜使用 growth 排名
        const rank = isRevenue ? (item.rank || (start + index + 1)) : (rankMap[item.handle] || (start + index + 1));
        const tags = (item.tags || []).slice(0, 4);

        // 排名徽章样式
        let rankBadge = '';
        if (rank === 1) {
          rankBadge = '<div class="w-8 h-8 bg-gradient-to-br from-yellow-400 to-amber-500 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-yellow-500/30">1</div>';
        } else if (rank === 2) {
          rankBadge = '<div class="w-8 h-8 bg-gradient-to-br from-gray-300 to-gray-400 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-gray-400/30">2</div>';
        } else if (rank === 3) {
          rankBadge = '<div class="w-8 h-8 bg-gradient-to-br from-amber-600 to-amber-700 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-amber-600/30">3</div>';
        } else {
          rankBadge = `<div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 font-semibold text-sm">${rank}</div>`;
        }

        // 排名变化显示
        const rankChange = rankChangeMap[item.handle] || { type: 'new' };
        let changeHtml = '';
        if (rankChange.type === 'new') {
          changeHtml = '<span class="inline-flex items-center px-2 py-1 bg-blue-50 text-blue-600 rounded text-xs font-semibold">NEW</span>';
        } else if (rankChange.type === 'up') {
          changeHtml = `<span class="inline-flex items-center text-green-600 font-semibold text-sm">+${rankChange.value}</span>`;
        } else if (rankChange.type === 'down') {
          changeHtml = `<span class="inline-flex items-center text-red-600 font-semibold text-sm">-${rankChange.value}</span>`;
        } else {
          changeHtml = '<span class="inline-flex items-center text-gray-400 font-semibold text-sm">0</span>';
        }

        // 主数据行
        const mainRow = `
          <tr data-list-item class="hover:bg-gradient-to-r hover:from-blue-50/50 hover:to-indigo-50/50 transition-all group ${state.showTrendView ? 'border-b-0' : ''}">
            <td class="px-5 py-4">${rankBadge}</td>

    // 渲染分页
    function renderPagination() {
      const pagination = document.getElementById('pagination');
      const totalPages = Math.ceil(state.filteredData.length / PAGE_SIZE);

      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }

      let html = '';

      // 上一页按钮
      html += `
        <button onclick="handlePageChange(${state.currentPage - 1})"
                class="w-10 h-10 rounded-xl flex items-center justify-center ${state.currentPage === 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-100 hover:text-blue-600'} transition"
                ${state.currentPage === 1 ? 'disabled' : ''}>
          <i class="fas fa-chevron-left"></i>
        </button>
      `;

      // 页码按钮
      const maxButtons = 5;
      let startPage = Math.max(1, state.currentPage - Math.floor(maxButtons / 2));
      let endPage = Math.min(totalPages, startPage + maxButtons - 1);

      if (endPage - startPage < maxButtons - 1) {
        startPage = Math.max(1, endPage - maxButtons + 1);
      }

      if (startPage > 1) {
        html += `<button onclick="handlePageChange(1)" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-600 hover:bg-gray-100 transition">1</button>`;
        if (startPage > 2) {
          html += `<span class="px-2 text-gray-400">...</span>`;
        }
      }

      for (let i = startPage; i <= endPage; i++) {
        html += `
          <button onclick="handlePageChange(${i})"
                  class="w-10 h-10 rounded-xl flex items-center justify-center transition font-medium ${i === state.currentPage ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-500/25' : 'text-gray-600 hover:bg-gray-100'}">
            ${i}
          </button>
        `;
      }

      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          html += `<span class="px-2 text-gray-400">...</span>`;
        }
        html += `<button onclick="handlePageChange(${totalPages})" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-600 hover:bg-gray-100 transition">${totalPages}</button>`;
      }

      // 下一页按钮
      html += `
        <button onclick="handlePageChange(${state.currentPage + 1})"
                class="w-10 h-10 rounded-xl flex items-center justify-center ${state.currentPage === totalPages ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-100 hover:text-blue-600'} transition"
                ${state.currentPage === totalPages ? 'disabled' : ''}>
          <i class="fas fa-chevron-right"></i>
        </button>
      `;

      pagination.innerHTML = html;
    }

    // 更新个人中心月份列表
    function updatePCMonthList() {
      const monthList = document.getElementById('pcMonthList');

      // 获取每个网站最早出现的月份
      const handleToEarliestMonth = getHandleEarliestMonth();

      // 统计每个月份有多少收藏/备注的网站首次上榜
      const monthCounts = {};

      allHandles.forEach(h => {

    // 获取每个网站最早出现的月份
    function getHandleEarliestMonth() {
      const handleToEarliestMonth = new Map();
      // 按月份从早到晚排序
      const sortedMonths = Object.keys(state.allData).sort();
      sortedMonths.forEach(month => {
        (state.allData[month] || []).forEach(item => {
          // 只记录最早出现的月份
          if (!handleToEarliestMonth.has(item.handle)) {
            handleToEarliestMonth.set(item.handle, month);
          }
        });
      });
      return handleToEarliestMonth;
    }

    // 应用个人中心筛选并渲染
    function applyPCFiltersAndRender() {
      // 收集所有收藏和备注的网站
      const allFavorites = getAllFavorites();
      const noteHandles = Object.keys(state.notes);

      // 获取所有需要显示的 handle
      let handleSet = new Set();

      if (state.pcTab === 'all') {
        // 全部：收藏 + 备注
        allFavorites.forEach(h => handleSet.add(h));
        noteHandles.forEach(h => handleSet.add(h));
      } else if (state.pcTab === 'favorites') {
        // 只显示收藏
        allFavorites.forEach(h => handleSet.add(h));
      } else if (state.pcTab === 'notes') {
        // 只显示有备注的
        noteHandles.forEach(h => handleSet.add(h));
      }

      // 获取每个网站最早出现的月份
      const handleToEarliestMonth = getHandleEarliestMonth();

      // 按最早出现的月份筛选
      if (state.pcMonth !== 'all') {
        const filtered = new Set();
        handleSet.forEach(h => {
          const earliestMonth = handleToEarliestMonth.get(h);
          if (earliestMonth === state.pcMonth) {
            filtered.add(h);
          }
        });
        handleSet = filtered;
      }

      // 从 allData 中查找这些网站的详细信息
      const handleToInfo = new Map();

      // 从各月份数据中查找详细信息（取最早月份的数据）
      const sortedMonths = Object.keys(state.allData).sort();
      sortedMonths.forEach(month => {
        (state.allData[month] || []).forEach(item => {
          if (handleSet.has(item.handle) && !handleToInfo.has(item.handle)) {
            handleToInfo.set(item.handle, {
              ...item,
              earliestMonth: month
            });
          }
        });
      });

      // 对于只有备注但没有在 allData 中找到的 handle，创建简单的占位信息
      handleSet.forEach(h => {
        if (!handleToInfo.has(h)) {
          handleToInfo.set(h, {
            handle: h,
            name: h,
            description: '',
            tags: [],
            earliestMonth: '-'
          });
        }
      });

      // 转换为数组并按最早出现月份排序（最新的在前）
      state.pcFilteredData = Array.from(handleToInfo.values()).sort((a, b) => {
        const aMonth = (a.earliestMonth || '0000-00');
        const bMonth = (b.earliestMonth || '0000-00');
        return bMonth.localeCompare(aMonth);
      });

      renderPCStats();
      renderPCTable();
      renderPCPagination();
    }

        html += `
          <button onclick="handlePCPageChange(${i})"
                  class="w-10 h-10 rounded-xl flex items-center justify-center transition font-medium ${i === state.pcCurrentPage ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-500/25' : 'text-gray-600 hover:bg-gray-100'}">
            ${i}
          </button>
        `;
      }

      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          html += `<span class="px-2 text-gray-400">...</span>`;
        }
        html += `<button onclick="handlePCPageChange(${totalPages})" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-600 hover:bg-gray-100 transition">${totalPages}</button>`;
      }

      // 下一页按钮
      html += `
        <button onclick="handlePCPageChange(${state.pcCurrentPage + 1})"
                class="w-10 h-10 rounded-xl flex items-center justify-center ${state.pcCurrentPage === totalPages ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-100 hover:text-indigo-600'} transition"
                ${state.pcCurrentPage === totalPages ? 'disabled' : ''}>
          <i class="fas fa-chevron-right"></i>
        </button>
      `;

      pagination.innerHTML = html;
    }

    // 处理个人中心分页变化
    function handlePCPageChange(page) {
      const totalPages = Math.ceil(state.pcFilteredData.length / PAGE_SIZE);
      if (page < 1 || page > totalPages) return;
      state.pcCurrentPage = page;
      renderPCTable();
      renderPCPagination();
      // 滚动到顶部
      document.getElementById('personalCenterView').scrollIntoView({ behavior: 'smooth' });
    }
  </script>

</body>
</html>
